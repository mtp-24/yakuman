<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yakuman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dark felt table. Left rail = blind status, right = the board (talismans, open melds, river, hand). Shop and menus are full overlays. */
:root{
  --bg:#0d1714; --felt:#15302a; --felt2:#1b3b33; --panel:#1a2420; --panel2:#22302b; --line:#2f4740;
  --fg:#efe6d2; --muted:#9db0a6; --accent:#d9a441; --accent2:#c9453a; --good:#6fcf97; --bad:#e86b5f; --info:#7fb3e0;
  --tile:#f4ecd8; --tile2:#e2d6b8; --tile-edge:#b9ab86; --tile-back:#2b5c8f; --tile-back2:#1d3f63;
  --man:#9b2d1f; --pin:#1f4f8f; --sou:#2e7d4f; --redfive:#d12c1f; --ink:#1b1b1b;
  --display:'Shippori Mincho','Hiragino Mincho ProN','Noto Serif JP',Georgia,serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --tilefont:'Hiragino Mincho ProN','Noto Serif JP','Shippori Mincho','Yu Mincho',serif;
  --tw:clamp(52px,5.4vw,84px); --th:calc(var(--tw) * 1.36); --tws:clamp(42px,3.9vw,62px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;padding:7px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
button.danger{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.ghost{background:transparent}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Header */
header{display:flex;align-items:baseline;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .hdr-nav{align-self:center}
header h1{font-size:22px;letter-spacing:.04em;color:var(--accent)}
header h1 span{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;letter-spacing:.1em;margin-left:8px}
header .spacer{flex:1}
header .hdr-stat{font-size:13px}
header .hdr-stat b{color:var(--accent)}
.hdr-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hdr-nav button{padding:6px 10px;font-size:12px;white-space:nowrap}

/* Main table */
#app{display:flex;flex-direction:column;min-height:100%}
main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;padding:12px 16px;flex:1;min-width:0}
.zone-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:1000px){.zone-row{grid-template-columns:1fr}}

aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.blind-name{font-family:var(--display);font-size:20px;color:var(--accent)}
.blind-name.boss{color:var(--accent2)}
.boss-desc{font-size:12px;color:var(--fg);background:rgba(201,69,58,.12);border:1px solid rgba(201,69,58,.4);border-radius:6px;padding:6px 8px;margin-top:6px}
.target{font-size:26px;font-family:var(--display);color:var(--fg)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f1cf7a);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.stat{background:var(--panel2);border-radius:6px;padding:6px 8px}
.stat .v{font-size:20px;font-family:var(--display)}
.stat.plays .v{color:var(--info)} .stat.discards .v{color:var(--bad)} .stat.money .v{color:var(--accent)}
.lastplay{font-size:12px}
.lastplay .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.lastplay .row:last-child{border-bottom:0}
.lastplay .total{font-size:18px;font-family:var(--display);color:var(--accent);margin-top:6px}
.lastplay .formula{color:var(--muted)}

.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;overflow:visible}
.zone .zhead{flex-wrap:wrap}
.zone .zhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.zone .zhead .label{color:#bfd0c6}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{min-width:110px;min-height:50px;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;background:rgba(0,0,0,.15);font-size:11px;flex:1 1 110px;max-width:200px}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--panel);cursor:pointer}
.slot.filled.sel{box-shadow:0 0 0 2px var(--accent)}
.slot.filled{touch-action:none;user-select:none}
.order{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:10px;font-family:var(--body);margin-right:6px;vertical-align:middle;letter-spacing:0}
.slot.dragging{z-index:30;opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 2px var(--accent);transition:none}
.slot.drop-before{box-shadow:-4px 0 0 0 var(--accent)} .slot.drop-after{box-shadow:4px 0 0 0 var(--accent)}
.sline.convert{color:var(--accent);border-top:1px dashed var(--line);margin-top:2px;padding-top:4px}
.slot .n{font-family:var(--display);color:var(--accent);font-size:14px}
.slot .d{color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
.slot.kami .n{color:#c9a7e8} .slot.omikuji .n{color:var(--info)}
.row-tiles{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;min-height:calc(var(--th) + 8px)}
#open,#river{min-height:calc(var(--tws) * 1.36 + 8px)}
#hand{row-gap:20px;padding-top:12px}
.meld{display:flex;gap:2px;padding:4px;border-radius:6px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.meld.closedmeld{border-color:var(--good)}
.meld .mt{font-size:10px;color:var(--muted);align-self:center;writing-mode:vertical-rl;margin-right:3px;letter-spacing:.1em}

/* Tiles */
.tile{position:relative;width:var(--tw);height:var(--th);border-radius:6px;background:linear-gradient(180deg,var(--tile),var(--tile2));border:1px solid var(--tile-edge);box-shadow:0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:var(--tilefont);cursor:pointer;user-select:none;transition:transform .12s;flex:0 0 auto}
.tile.small{--tw:var(--tws);--th:calc(var(--tws) * 1.36);box-shadow:0 2px 0 #8f815f}
.tile.small .rank{font-size:16px} .tile.small .suitg{font-size:12px} .tile.small .honor{font-size:22px}
.tile.sel{transform:translateY(-12px);box-shadow:0 3px 0 #8f815f,0 0 0 2px var(--accent),0 8px 14px rgba(0,0,0,.5)}
.tile.small.sel{transform:translateY(-6px)}
.tile.dim{opacity:.5}
#hand .tile{touch-action:none}
.tile.dragging{z-index:30;opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 2px var(--accent);transition:none;cursor:grabbing}
.tile.drop-before{box-shadow:-4px 0 0 0 var(--accent),0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4)}
.tile.drop-after{box-shadow:4px 0 0 0 var(--accent),0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4)}
.tile svg{width:100%;height:100%;display:block;padding:2px}
.sheet{width:100%;border-collapse:collapse;font-size:12px}
.sheet th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
.sheet td{padding:5px 8px;border-bottom:1px dashed var(--line);vertical-align:top}
.sheet td:nth-child(2){white-space:nowrap;color:var(--accent)}
.tile .rank{font-size:26px;font-weight:700;line-height:1}
.tile .suitg{font-size:16px;line-height:1.1}
.tile.m .suitg{color:var(--man)} .tile.p .suitg{color:var(--pin)} .tile.s .suitg{color:var(--sou)}
.tile.m .rank{color:var(--ink)} .tile.p .rank{color:var(--pin)} .tile.s .rank{color:var(--sou)}
.tile.red .rank{color:var(--redfive);text-shadow:0 0 6px rgba(209,44,31,.5)}
.tile .honor{font-size:32px;font-weight:700;line-height:1}
.tile .honor.h5{color:#1f4f8f;-webkit-text-stroke:1px #1f4f8f;color:transparent} .tile .honor.h6{color:#2e7d4f} .tile .honor.h7{color:#c9281c}
.tile.back{background:linear-gradient(180deg,var(--tile-back),var(--tile-back2));border-color:#13304d;box-shadow:0 3px 0 #0f2740,0 4px 6px rgba(0,0,0,.4)}
.tile.back::after{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.25);border-radius:4px}
/* Engraved tile faces */
.tile.eng-gold{background:linear-gradient(160deg,#fbeec1 0%,#e2c05e 45%,#c99a2e 100%);border-color:#9a7418;box-shadow:0 3px 0 #7d5c0f,0 4px 8px rgba(0,0,0,.4),0 0 10px rgba(226,192,94,.55)}
.tile.eng-gold .shine{position:absolute;inset:0;border-radius:6px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%);pointer-events:none}
.tile.eng-obsidian{background:linear-gradient(160deg,#c3c8cf 0%,#8a9099 55%,#62676e 100%);border-color:#2b2f34;box-shadow:0 3px 0 #1f2226,0 4px 8px rgba(0,0,0,.5)}
.tile.eng-jade{background:linear-gradient(160deg,#dff3e6 0%,#9ad6b4 50%,#5fae88 100%);border-color:#2e7d4f;box-shadow:0 3px 0 #22573a,0 4px 8px rgba(0,0,0,.4)}
.tile.eng-steel{background:linear-gradient(160deg,#eef2f6 0%,#c3ccd5 45%,#8f9ca8 100%);border-color:#56657a;box-shadow:0 3px 0 #3d4a57,0 4px 8px rgba(0,0,0,.45)}
.tile.eng-steel .brush{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.tile.eng-glass{background:linear-gradient(160deg,rgba(238,247,255,.95) 0%,rgba(198,223,242,.9) 55%,rgba(169,203,230,.9) 100%);border-color:#86aecd;box-shadow:0 3px 0 #6f93ad,0 4px 6px rgba(0,0,0,.4),inset 0 0 12px rgba(255,255,255,.7)}
.tile .seal{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b6e,#b3140a 70%);border:2px solid #fff3e0;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.tile .seal::after{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(255,255,255,.7)}
.tile .dmark{position:absolute;top:4px;right:4px;width:11px;height:11px;transform:rotate(45deg);background:#c9281c;border:1.5px solid #ffd27a;box-shadow:0 0 4px rgba(201,40,28,.7)}
.tile .dmark::after{content:'';position:absolute;inset:3px;background:#ffd27a;transform:rotate(45deg);border-radius:1px}
.tile.small .seal{width:12px;height:12px;top:-4px} .tile.small .dmark{width:9px;height:9px;top:3px;right:3px}
.tile.tiny .seal{width:10px;height:10px;top:-3px;border-width:1.5px} .tile.tiny .dmark{width:7px;height:7px;top:2px;right:2px}
.tile.safe::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 4px var(--good)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.hint .hint-main{color:var(--fg);font-weight:600}
.hint .good{color:var(--good)} .hint .bad{color:var(--bad)}
.tile.called{outline:2px solid var(--info);outline-offset:-2px}
.dora-ind{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}

/* Actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{padding:10px 16px;font-size:14px}
.msg{min-height:20px;font-size:13px;color:var(--accent)}
.msg.err{color:var(--bad)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(5,10,9,.86);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:900px;width:100%;min-width:0}
.modal h2{font-size:26px;color:var(--accent);margin-bottom:6px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0;align-items:stretch}
.shopcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.shopcard .kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shopcard .n{font-family:var(--display);font-size:16px;color:var(--accent)}
.shopcard.kami .n{color:#c9a7e8} .shopcard.omikuji .n{color:var(--info)} .shopcard.scroll .n{color:var(--good)} .shopcard.flower .n{color:#f0a3b8}
.shopcard .d{font-size:12px;color:var(--fg)}
.shopcard .buy{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.shopcard.sold{opacity:.4}
.menu-rules{columns:2;column-gap:24px;font-size:13px}
@media (max-width:700px){.menu-rules{columns:1}}
.menu-rules p{margin:0 0 8px;break-inside:avoid}
.menu-rules h3{font-family:var(--display);font-size:16px;color:var(--accent);margin:4px 0 6px;break-after:avoid}
.deckrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;justify-items:center}
@media (max-width:600px){.deckrow{display:flex;flex-wrap:wrap}}
.modal:has(.deckwrap){max-width:640px}
.deckcell{text-align:center;font-size:11px;color:var(--muted);width:52px}
.deckcell .tile{margin:0 auto 2px;cursor:default}
.deckcell b{color:var(--fg)}
.debug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:12px}
.debug select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px}
.reward-list{display:grid;grid-template-columns:1fr auto;gap:4px 16px;max-width:360px;margin:10px 0}
.score-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:44px;color:var(--accent);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;z-index:15;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.score-pop{animation:none;opacity:1}}
.stage{position:fixed;inset:0;z-index:18;display:flex;align-items:center;justify-content:center;background:rgba(5,10,9,.55);padding:16px;cursor:pointer}
.stage-inner{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.stage-title{font-family:var(--display);font-size:18px;color:var(--accent);margin-bottom:8px}
.stage-tiles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;min-height:50px}
.stage-tiles .tile{transition:transform .12s}
.stage-tiles .tile.hit{transform:translateY(-8px) scale(1.12);box-shadow:0 2px 0 #8f815f,0 0 0 2px var(--accent),0 0 14px var(--accent)}
.stage-tiles .float{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-family:var(--body);font-weight:700;color:var(--accent);text-shadow:0 1px 3px #000;animation:floatup .9s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-60%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-220%)}}
.stage-lines{max-height:150px;overflow:auto;font-size:12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:4px 0;margin-bottom:8px}
.sline{display:flex;justify-content:space-between;gap:10px;padding:2px 0;animation:slidein .18s ease-out}
.sline.yaku{color:var(--accent);font-weight:600} .sline.tal{color:var(--info)} .sline.bad{color:var(--bad)}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.stage-math{font-family:var(--display);font-size:26px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stage-math .chips{color:var(--info)} .stage-math .mult{color:var(--bad)} .stage-math .x,.stage-math .eq{color:var(--muted);font-size:18px} .stage-math .tot{color:var(--accent);margin-left:auto}
.stage-math .tot.final{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage-skip{font-size:11px;text-align:right;margin-top:6px}
.slot.bounce{animation:bounce .45s ease-out}
@keyframes bounce{0%{transform:none}30%{transform:translateY(-8px) rotate(-2deg)}60%{transform:translateY(0) rotate(1deg)}100%{transform:none}}
.tile.arrive{animation:arrive .3s ease-out}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sline,.tile.arrive,.slot.bounce,.stage-math .tot.final,.stage-tiles .float{animation:none}.stage-tiles .tile{transition:none}}
.preview{min-height:22px;font-family:var(--display);font-size:20px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.preview .pchips{color:var(--info)} .preview .pmult{color:var(--bad)} .preview .px{color:var(--muted);font-size:14px} .preview .ptot{color:var(--accent)} .preview .ptot.hot{color:#ff9f43;text-shadow:0 0 10px rgba(255,107,26,.8)} .preview .muted{font-family:var(--body);font-size:12px;align-self:center}
.edtag{display:inline-block;font-size:10px;padding:0 6px;border-radius:10px;font-family:var(--body);font-weight:700;vertical-align:middle}
.edtag.ed-foil{background:linear-gradient(90deg,#9aa5b1,#e6ecf2,#9aa5b1);color:#1b1b1b} .edtag.ed-holo{background:linear-gradient(90deg,#ff7eb3,#7afcff,#feff9c,#ff7eb3);color:#1b1b1b} .edtag.ed-poly{background:linear-gradient(90deg,#f97316,#eab308,#22c55e,#3b82f6,#a855f7);color:#fff}
.slot.ed-foil,.shopcard.ed-foil{border-color:#c9d3dd;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)} .slot.ed-holo,.shopcard.ed-holo{border-image:linear-gradient(135deg,#ff7eb3,#7afcff,#feff9c) 1} .slot.ed-poly,.shopcard.ed-poly{border-image:linear-gradient(135deg,#f97316,#eab308,#22c55e,#3b82f6,#a855f7) 1}
.tile.glass{background:linear-gradient(160deg,#eef7ff 0%,#c6dff2 55%,#a9cbe6 100%);border-color:#86aecd;box-shadow:0 3px 0 #6f93ad,0 4px 6px rgba(0,0,0,.4)}
.edtag.ed-neg{background:#111;color:#fff;border:1px solid #888} .slot.ed-neg,.shopcard.ed-neg{border-color:#888;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}

.stage-tiles .float.again{color:var(--bad)}
.stage-math.hot .tot{color:#ff9f43;text-shadow:0 0 12px #ff6b1a,0 0 28px #ff3d00;animation:flame .5s ease-in-out infinite alternate}
.stage-math.blazing{animation:shake .25s linear infinite}
@keyframes flame{from{text-shadow:0 0 10px #ff6b1a,0 0 24px #ff3d00;transform:scale(1)}to{text-shadow:0 0 18px #ffb347,0 0 40px #ff3d00,0 0 60px #ff1a00;transform:scale(1.06)}}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}100%{transform:translate(0,0)}}
.stage-inner{position:relative;overflow:hidden}
.ember{position:absolute;bottom:-6px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#ffd166,#ff6b1a 60%,transparent 70%);opacity:0;animation:rise 1.4s ease-out infinite;pointer-events:none}

<div id="app">
<header>
  <h1 data-notr>Yakuman<span>MAHJONG ROGUELITE · PLAYTEST BUILD</span></h1>

<main>
  <aside>

  </aside>

      <div class="zhead" style="margin-top:8px"><span class="label">Consumables</span><span class="muted" id="conCount"></span></div>
      <div class="slots" id="consumables"></div>
    </div>
    <div class="zone-row">
    <div class="zone">
      <div class="zhead"><span class="label">Open Melds</span><span class="muted" id="openInfo"></span></div>
      <div class="row-tiles" id="open"></div>
    </div>
    <div class="zone">
      <div class="zhead"><span class="label">The River</span><span class="muted" id="riverInfo">Discards stay here all Blind. Select one plus 2–3 hand tiles to Call.</span></div>

    </div>
    </div>
    <div class="zone handzone" id="handZone">
      <div class="callbanner" id="callBanner" hidden></div>
      <div class="zhead"><span class="label">Hand</span><span class="muted" id="handInfo"></span><span style="flex:1"></span><button id="btnSort" class="ghost" style="padding:3px 8px;font-size:12px">Sort</button></div>

</div>

<div id="pop"></div>
<div id="stage" class="stage" hidden></div>
<script>
'use strict';
// ===================== CONFIG (tune here while playtesting) =====================
const CFG = {
  handSize: 17,          // tiles held; a complete hand still uses 14 of them
  playsPerBlind: 5,
  discardsPerBlind: 5,
  maxDiscardTiles: 7,
  startMoney: 8,
  talismanSlots: 5,
  consumableSlots: 2,
  antes: 8,
  anteBase: [250, 700, 2000, 4500, 9000, 16000, 28000, 45000],
  blindMult: { small: 1, big: 1.5, boss: 2 },
  blindReward: { small: 3, big: 4, boss: 5 },
  interestPer: 5, interestCap: 5,
  rerollCost: 5,
  // Base values per play type. Scrolls of Mastery add +10 chips and +1 Han per level.
  meldBase: { single: { chips: 0, han: 0 }, pair: { chips: 5, han: 0 }, twopair: { chips: 15, han: 1 }, chi: { chips: 10, han: 1 }, pon: { chips: 20, han: 1 }, kan: { chips: 40, han: 2 }, hand: { chips: 120, han: 2 } },
  // Multi-meld plays ("ladder B"). Key = melds,pair. A single meld + pair uses the meld's base +10 chips.
  rungs: { '2,0': { name: 'Two Melds', chips: 30, han: 1 }, '2,1': { name: 'Two Melds + Pair', chips: 40, han: 1 }, '3,0': { name: 'Three Melds', chips: 60, han: 2 }, '3,1': { name: 'Ready Hand', chips: 80, han: 2 }, '4,0': { name: 'Four Melds', chips: 100, han: 2 }, '4,1': { name: 'Four Melds + Pair', chips: 110, han: 2 } },
  kanBonus: { chips: 20, han: 1 },   // per Kan inside a multi-meld play
  // Optional pair ladder (experiment): plays of 3-6 different pairs with no melds. Off by default.
  pairLadder: false,
  pairRungs: { 3: { name: 'Three Pair', chips: 25, han: 1 }, 4: { name: 'Four Pair', chips: 40, han: 1 }, 5: { name: 'Five Pair', chips: 55, han: 2 }, 6: { name: 'Six Pair', chips: 70, han: 2 } },
  scrollChips: 10, scrollHan: 1,
  // Han -> multiplier. Index = Han. 13+ = x100.
  // Playtest 2: hand 17 (was 14), 5 discards (was 3), up to 7 tiles per discard (was 5).

  <p><b>Extra Han.</b> Each Red Five scored gives +1 Han. A Dora indicator is a tile flipped from the Wall; the next tile in sequence after it is the Dora (9 wraps to 1, Winds go East, South, West, North, Dragons go White, Green, Red), and each Dora scored gives +1 Han. Indicators last for the current Blind. In partial plays, a Pon or Kan of Winds or Dragons scores Yakuhai (+1 Han). Each Kan in a play with two or more melds adds +${K.chips} Chips and +${K.han} Han.</p>
  <p><b>Talismans.</b> After the Han table converts, your Talismans fire left to right. Some add Chips, some add flat Mult (+4 Mult), some multiply (×1.5 Mult). A +Mult Talisman placed before a ×Mult Talisman scores more than the reverse. Drag Talismans to reorder them; the number on each card is its firing order. Some Talismans grow as you play and show their current value on the card, and some copy another Talisman.</p>
  <p><b>Scrolls of Mastery.</b> Each level of a meld Scroll gives +${CFG.scrollChips} Chips for every matching meld or pair in a play and +${CFG.scrollHan} Han once per play. Levels apply inside complete hands too, so a complete hand always beats the Ready Hand inside it. Other Scrolls are named after a hand pattern, such as Tanyao, and add Han whenever it scores.</p>
  <p><b>Engravings.</b> Omikuji can engrave tiles, and you can see it on the tile: Gold Foil (gold face, ¥1 when scored), Obsidian (dark stone face, +20 Chips), Jade (green face, ×1.5 Mult), Steel (brushed metal face, ×1.5 Mult while held in hand), Glass (clear blue face, ×2 Mult, 1 in 4 chance to shatter and leave your Wall), Red Seal (a red wax seal, scores twice) and Dragon Mark (a red emblem in the corner, +1 Han). Hover a tile for its exact effect.</p>
  <p><b>Editions.</b> Shop Talismans sometimes come in an edition: ${Object.values(EDITIONS).map(e => `${e.name} (${e.desc})`).join(', ')}.</p>
  <h3>Between Blinds</h3>
  <p><b>Money.</b> Beating a Blind pays ¥${R.small} for a Small Blind, ¥${R.big} for a Big Blind and ¥${R.boss} for a Boss, plus ¥1 for each unused Play and ¥1 interest for every ¥${CFG.interestPer} you hold (at most ¥${CFG.interestCap}). Red and Black Stakes pay nothing for Small Blinds.</p>
  <p><b>Shop.</b> Spend money on Talismans (passive, ${CFG.talismanSlots} slots), Omikuji and Kami (consumables, ${CFG.consumableSlots} slots, used on selected hand tiles), Scrolls of Mastery (permanent upgrades), Flowers (run-long perks) and one booster pack (open it and keep one or two of what's inside). A reroll costs ¥${CFG.rerollCost}. Selling returns half the item's value: click a Talisman on the board and press Sell, or sell from inside the shop.</p>
  <p><b>Blind Select.</b> After the shop you see the Ante's three blinds with their targets, rewards and the Boss's rule. A Small or Big Blind can be skipped for the Tag on its card instead of its money: free packs, editions, coupons, money, a bigger hand or a different Boss. Tags you hold show in the side panel.</p>
  <p><b>Setup.</b> A new run lets you choose a Wall (deck), a Stake (difficulty) and a seed. Sharing a seed replays the same Wall, shops and bosses.</p>
  <h3>Help and Controls</h3>
  <p><b>Helper.</b> Under your hand the game shows how many tiles you are from a complete hand and, when you are one away, which tiles you are waiting on. Against The Purist it only counts your visible tiles. Settings has an optional assist that marks dead tiles with green dots.</p>
  <p><b>Arranging.</b> Drag hand tiles to reorder them. Dragging turns off auto-sort; Sort Hand sorts again. Tiles score in the order they sit, which matters for Shikigami.</p>
  <p><b>Keys.</b> Enter or P plays, D discards, C calls, K declares a Kan, Esc clears your selection. Click anywhere or press any key while a play scores to skip the animation.</p>
  </div><div style="margin-top:12px"><button id="mClose" class="primary">Close</button></div>`;
}

// A staged complete hand that exercises every counter: chips (Obsidian tile, Daruma, Scroll chips), Han (four Yaku, Red Five, Dora,
// Dragon Mark, Scroll Han), and Mult (+Mult from Tengu, Kitsune and Kasa-obake, then x3 from Hannya and x1.5 from its Polychrome edition).
function stageDemoHand() {
  if (S.phase !== 'blind') { setMsg('Start a blind first, then stage the demo hand.', true); return render(); }
  S.wall.push(...S.hand); S.hand = []; S.open = []; S.pendingDiscard = 0; S.selected = []; S.river = [];
  const mk = (suit, rank, red, eng) => { const t = mkTile(suit, rank, !!red); t.eng = eng || null; t.d = ++S.drawSeq; return t; };
  // 234 Man, 234 Pin, 234 Sou (Sanshoku) + 678 Sou + pair of 5 Pin: Tanyao, Pinfu, Sanshoku Doujun
  const tiles = [mk('m', 2, false, 'obsidian'), mk('m', 3, false, 'redseal'), mk('m', 4), mk('p', 2), mk('p', 3), mk('p', 4, false, 'jade'), mk('s', 2), mk('s', 3), mk('s', 4), mk('s', 6, false, 'dragonmark'), mk('s', 7, false, 'gold'), mk('s', 8, false, 'glass'), mk('p', 5, true), mk('p', 5), mk('z', 1), mk('z', 7), mk('m', 9)];
  S.hand = tiles; S.sortHand = false;
  S.selected = tiles.slice(0, 14).map(t => t.id);
  for (let i = 0; i < 5; i++) S.river.push(mk('z', 2 + (i % 3)));                 // five River tiles feed Daruma
  const ind = mk('s', 1); S.indicators = [ind]; S.dora = [nextDora(idx(ind))];       // indicator 1 Sou makes every 2 Sou a Dora
  S.talismans = ['daruma', 'tengu', 'kitsune', 'kasaobake', 'hannya']; S.editions = { hannya: 'poly' }; S.talState.kasaobake = 6;
  S.scrolls.meld.chi = Math.max(S.scrolls.meld.chi || 0, 2); S.scrolls.meld.hand = Math.max(S.scrolls.meld.hand || 0, 1);
  if (S.target < 5000) S.target = 5000;

}

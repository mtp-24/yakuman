<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yakuman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dark felt table. Left rail = blind status, right = the board (talismans, open melds, river, hand). Shop and menus are full overlays. */
:root{
  --bg:#0d1714; --felt:#15302a; --felt2:#1b3b33; --panel:#1a2420; --panel2:#22302b; --line:#2f4740;
  --fg:#efe6d2; --muted:#9db0a6; --accent:#d9a441; --accent2:#c9453a; --good:#6fcf97; --bad:#e86b5f; --info:#7fb3e0;
  --tile:#f4ecd8; --tile2:#e2d6b8; --tile-edge:#b9ab86; --tile-back:#2b5c8f; --tile-back2:#1d3f63;
  --man:#9b2d1f; --pin:#1f4f8f; --sou:#2e7d4f; --redfive:#d12c1f; --ink:#1b1b1b;
  --display:'Shippori Mincho','Hiragino Mincho ProN','Noto Serif JP',Georgia,serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --tilefont:'Hiragino Mincho ProN','Noto Serif JP','Shippori Mincho','Yu Mincho',serif;
  --tw:clamp(52px,5.4vw,84px); --th:calc(var(--tw) * 1.36); --tws:clamp(42px,3.9vw,62px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;padding:7px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
button.danger{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.ghost{background:transparent}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Header */
header{display:flex;align-items:baseline;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .hdr-nav{align-self:center}
header h1{font-size:22px;letter-spacing:.04em;color:var(--accent)}
header h1 span{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;letter-spacing:.1em;margin-left:8px}
header .spacer{flex:1}
header .hdr-stat{font-size:13px}
header .hdr-stat b{color:var(--accent)}
.hdr-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hdr-nav button{padding:6px 10px;font-size:12px;white-space:nowrap}

/* Main table */
#app{display:flex;flex-direction:column;min-height:100%}
main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;padding:12px 16px;flex:1;min-width:0}
.zone-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:1000px){.zone-row{grid-template-columns:1fr}}

aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.blind-name{font-family:var(--display);font-size:20px;color:var(--accent)}
.blind-name.boss{color:var(--accent2)}
.boss-desc{font-size:12px;color:var(--fg);background:rgba(201,69,58,.12);border:1px solid rgba(201,69,58,.4);border-radius:6px;padding:6px 8px;margin-top:6px}
.target{font-size:26px;font-family:var(--display);color:var(--fg)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f1cf7a);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.stat{background:var(--panel2);border-radius:6px;padding:6px 8px}
.stat .v{font-size:20px;font-family:var(--display)}
.stat.plays .v{color:var(--info)} .stat.discards .v{color:var(--bad)} .stat.money .v{color:var(--accent)}
.lastplay{font-size:12px}
.lastplay .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.lastplay .row:last-child{border-bottom:0}
.lastplay .total{font-size:18px;font-family:var(--display);color:var(--accent);margin-top:6px}
.lastplay .formula{color:var(--muted)}

.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;overflow:visible}
.zone .zhead{flex-wrap:nowrap;min-height:26px} .zone .zhead > .label{flex:none} .zone .zhead > .muted{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone .zhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.zone .zhead .label{color:#bfd0c6}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.concol{margin-top:8px}
/* Wide screens: Talismans and Consumables share one row, each column sized by its slot count so every slot is the same width */
@media (min-width:1100px){
  .talcols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,2fr);gap:8px}
  .concol{margin-top:0;padding-left:8px;border-left:1px dashed var(--line)}
  .talcols .slots{flex-wrap:nowrap} .talcols .slot{flex:1 1 0;min-width:0;max-width:none}
  .talcols .talcol{display:flex;flex-direction:column} .talcols .slots{flex:1 1 auto;align-items:stretch}
}
.slot{min-width:110px;min-height:50px;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;background:rgba(0,0,0,.15);font-size:11px;flex:1 1 110px;max-width:200px}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--panel);cursor:pointer}
.slot.filled.sel{box-shadow:0 0 0 2px var(--accent)}
.slot.filled{touch-action:none;user-select:none}
.order{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:10px;font-family:var(--body);margin-right:6px;vertical-align:middle;letter-spacing:0}
.slot.dragging{z-index:30;opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 2px var(--accent);transition:none}
.slot.drop-before{box-shadow:-4px 0 0 0 var(--accent)} .slot.drop-after{box-shadow:4px 0 0 0 var(--accent)}
.sline.convert{color:var(--accent);border-top:1px dashed var(--line);margin-top:2px;padding-top:4px}
.slot .n{font-family:var(--display);color:var(--accent);font-size:14px}
.slot .kind{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:1px}
.hb-head{height:36px;display:flex;align-items:center;min-width:0;margin:-3px 0 6px}
.hb-head .hb-title{font-family:var(--display);color:var(--fg);line-height:1.15;font-size:22px;overflow-wrap:anywhere;font-weight:500}
.hb-head .hb-title.muted{color:var(--muted)}
.hb-head .hb-title .tag{font-family:var(--body);font-size:10px;vertical-align:middle;margin-left:4px}
.hb-head .hb-title.one,.hb-head .hb-tot{position:relative;top:-2px}
.hb-head .hb-tot{display:block;font-family:var(--display);font-size:32px;color:var(--accent);width:100%;text-align:center;line-height:36px;white-space:nowrap;overflow:hidden}
.slot .d{color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
.slot.kami .n{color:#c9a7e8} .slot.omikuji .n{color:var(--info)}
.row-tiles{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;min-height:calc(var(--th) + 8px)}
#open,#river{min-height:calc(var(--tws) * 1.36 + 8px)}
#hand{row-gap:20px;padding-top:12px}
.meld{display:flex;gap:2px;padding:4px;border-radius:6px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.meld.closedmeld{border-color:var(--good)}
.meld .mt{font-size:10px;color:var(--muted);align-self:center;writing-mode:vertical-rl;margin-right:3px;letter-spacing:.1em;text-transform:uppercase}

/* Tiles */
.tile{position:relative;width:var(--tw);height:var(--th);border-radius:6px;background:linear-gradient(180deg,var(--tile),var(--tile2));border:1px solid var(--tile-edge);box-shadow:0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:var(--tilefont);cursor:pointer;user-select:none;transition:transform .12s;flex:0 0 auto}
.tile.small{--tw:var(--tws);--th:calc(var(--tws) * 1.36);box-shadow:0 2px 0 #8f815f}
.tile.small .rank{font-size:16px} .tile.small .suitg{font-size:12px} .tile.small .honor{font-size:22px}
.tile.sel{transform:translateY(-12px);box-shadow:0 3px 0 #8f815f,0 0 0 2px var(--accent),0 8px 14px rgba(0,0,0,.5)}
.tile.small.sel{transform:translateY(-6px)}
.tile.dim{opacity:.5}
#hand .tile{touch-action:none}
.tile.dragging{z-index:30;opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 2px var(--accent);transition:none;cursor:grabbing}
.tile.drop-before{box-shadow:-4px 0 0 0 var(--accent),0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4)}
.tile.drop-after{box-shadow:4px 0 0 0 var(--accent),0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4)}
.tile svg{width:100%;height:100%;display:block;padding:2px}
.sheet{width:100%;border-collapse:collapse;font-size:12px}
.sheet th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
.sheet td{padding:5px 8px;border-bottom:1px dashed var(--line);vertical-align:top}
.sheet td:nth-child(2){white-space:nowrap;color:var(--accent)}
.tile .rank{font-size:26px;font-weight:700;line-height:1}
.tile .suitg{font-size:16px;line-height:1.1}
.tile.m .suitg{color:var(--man)} .tile.p .suitg{color:var(--pin)} .tile.s .suitg{color:var(--sou)}
.tile.m .rank{color:var(--ink)} .tile.p .rank{color:var(--pin)} .tile.s .rank{color:var(--sou)}
.tile.red .rank{color:var(--redfive);text-shadow:0 0 6px rgba(209,44,31,.5)}
.tile .honor{font-size:32px;font-weight:700;line-height:1}
.tile .honor.h5{color:#1f4f8f;-webkit-text-stroke:1px #1f4f8f;color:transparent} .tile .honor.h6{color:#2e7d4f} .tile .honor.h7{color:#c9281c}
.tile.back{background:linear-gradient(180deg,var(--tile-back),var(--tile-back2));border-color:#13304d;box-shadow:0 3px 0 #0f2740,0 4px 6px rgba(0,0,0,.4)}
.tile.back::after{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.25);border-radius:4px}
/* Engraved tile faces */
.tile.eng-gold{background:linear-gradient(160deg,#fbeec1 0%,#e2c05e 45%,#c99a2e 100%);border-color:#9a7418;box-shadow:0 3px 0 #7d5c0f,0 4px 8px rgba(0,0,0,.4),0 0 10px rgba(226,192,94,.55)}
.tile.eng-gold .shine{position:absolute;inset:0;border-radius:6px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%);pointer-events:none}
.tile.eng-obsidian{background:linear-gradient(160deg,#c3c8cf 0%,#8a9099 55%,#62676e 100%);border-color:#2b2f34;box-shadow:0 3px 0 #1f2226,0 4px 8px rgba(0,0,0,.5)}
.tile.eng-jade{background:linear-gradient(160deg,#dff3e6 0%,#9ad6b4 50%,#5fae88 100%);border-color:#2e7d4f;box-shadow:0 3px 0 #22573a,0 4px 8px rgba(0,0,0,.4)}
.tile.eng-steel{background:linear-gradient(160deg,#eef2f6 0%,#c3ccd5 45%,#8f9ca8 100%);border-color:#56657a;box-shadow:0 3px 0 #3d4a57,0 4px 8px rgba(0,0,0,.45)}
.tile.eng-steel .brush{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.tile.eng-glass{background:linear-gradient(160deg,rgba(238,247,255,.95) 0%,rgba(198,223,242,.9) 55%,rgba(169,203,230,.9) 100%);border-color:#86aecd;box-shadow:0 3px 0 #6f93ad,0 4px 6px rgba(0,0,0,.4),inset 0 0 12px rgba(255,255,255,.7)}
.tile .seal{position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b6e,#b3140a 70%);border:2px solid #fff3e0;box-shadow:0 1px 3px rgba(0,0,0,.55)}
.tile .seal::after{content:'';position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(255,255,255,.7)}
.tile .dmark{position:absolute;top:4px;right:4px;width:11px;height:11px;transform:rotate(45deg);background:#c9281c;border:1.5px solid #ffd27a;box-shadow:0 0 4px rgba(201,40,28,.7)}
.tile .dmark::after{content:'';position:absolute;inset:3px;background:#ffd27a;transform:rotate(45deg);border-radius:1px}
.tile.small .seal{width:12px;height:12px;top:-4px} .tile.small .dmark{width:9px;height:9px;top:3px;right:3px}
.tile.tiny .seal{width:10px;height:10px;top:-3px;border-width:1.5px} .tile.tiny .dmark{width:7px;height:7px;top:2px;right:2px}
.tile.safe::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 4px var(--good)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.hint .hint-main{color:var(--fg);font-weight:600}
.hint .good{color:var(--good)} .hint .bad{color:var(--bad)}
.tile.called{outline:2px solid var(--info);outline-offset:-2px}
.dora-ind{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}

/* Actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{padding:10px 16px;font-size:14px}
.msg{min-height:20px;font-size:13px;color:var(--accent)}
.msg.err{color:var(--bad)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(5,10,9,.86);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:900px;width:100%;min-width:0;position:relative}
.modal-x{position:sticky;top:0;float:right;margin:-8px -8px 0 8px;width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;z-index:2;background:var(--panel)}
.wallcount{color:var(--muted);margin-left:4px}
.modal h2{font-size:26px;color:var(--accent);margin-bottom:6px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0;align-items:stretch}
/* Pack screen: narrower so 8 tiles fit one row; only the tile row is centred, cards line up like the shop */
.modal.packmodal{max-width:760px}
.packmodal .packhand{justify-content:center}
.ptile{display:flex;flex-direction:column;align-items:center;gap:5px;width:min-content}
.pmark{font-size:10px;line-height:1.2;color:var(--accent);text-align:center;min-height:12px;font-weight:600}
.ptile.gone .pmark{color:var(--bad)}
.packhand .tile.marked{box-shadow:0 0 0 2px var(--accent),0 3px 0 #8f815f,0 0 12px rgba(217,164,65,.45)}
.packhand .tile.gone{opacity:.4;filter:grayscale(1);cursor:default}
.ptile.gone{position:relative} .ptile.gone::after{content:'';position:absolute;left:4%;right:4%;top:40%;height:3px;border-radius:2px;background:var(--bad);transform:rotate(-38deg);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.shopcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.shopcard .kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shopcard .n{font-family:var(--display);font-size:16px;color:var(--accent)}
.shopcard.kami .n{color:#c9a7e8} .shopcard.omikuji .n{color:var(--info)} .shopcard.scroll .n{color:var(--good)} .shopcard.flower .n{color:#f0a3b8}
.shopcard .d{font-size:12px;color:var(--fg)}
.shopcard .buy{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.shopcard .buy{min-height:39px;align-items:center}   /* same height with buttons, Sold, Used or No picks left */
.shopcard.sold{opacity:.4}
.menu-rules{columns:2;column-gap:24px;font-size:13px}
.quickrules{margin:4px 0 0;padding-left:22px;display:grid;gap:8px;font-size:14px;line-height:1.5;max-width:720px} .quickrules li::marker{color:var(--accent);font-family:var(--display);font-weight:700}
@media (max-width:700px){.menu-rules{columns:1}}
.menu-rules p{margin:0 0 8px;break-inside:avoid}
.packhandwrap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;margin:0 0 10px}
.packhand{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;min-height:40px;container-type:inline-size} .packhand .tile{cursor:pointer;--tw:min(80px,calc((100cqw - 42px) / 8));--th:calc(var(--tw) * 1.36)}
@container (max-width: 480px){.packhand .tile{--tw:min(68px,calc((100cqw - 18px) / 4));--th:calc(var(--tw) * 1.36)}}
.lvline{font-size:12px;margin:6px 0 2px;padding:4px 8px;border-radius:6px;background:rgba(122,183,232,.1);border:1px solid rgba(122,183,232,.3)} .lvline b{color:var(--accent)}
.menu-rules h3{font-family:var(--display);font-size:16px;color:var(--accent);margin:4px 0 6px;break-after:avoid}
.deckrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;justify-items:center}
@media (max-width:600px){.deckrow{display:flex;flex-wrap:wrap}}
.modal:has(.deckwrap){max-width:640px}
.deckcell{text-align:center;font-size:11px;color:var(--muted);width:52px}
.deckcell .tile{margin:0 auto 2px;cursor:default}
.deckcell b{color:var(--fg)}
.debug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:12px}
.debug select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px}
.reward-list{display:grid;grid-template-columns:1fr auto;gap:4px 16px;max-width:360px;margin:10px 0}
.score-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:44px;color:var(--accent);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;z-index:15;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.score-pop{animation:none;opacity:1}}
.stage{position:fixed;inset:0;z-index:18;display:flex;align-items:center;justify-content:center;background:rgba(5,10,9,.55);padding:16px;cursor:pointer}
.stage-inner{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.stage-title{font-family:var(--display);font-size:18px;color:var(--accent);margin-bottom:8px}
.stage-tiles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;min-height:50px}
.stage-tiles .tile{transition:transform .12s}
.stage-tiles .tile.hit{transform:translateY(-8px) scale(1.12);box-shadow:0 2px 0 #8f815f,0 0 0 2px var(--accent),0 0 14px var(--accent)}
.stage-tiles .float{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-family:var(--body);font-weight:700;color:var(--accent);text-shadow:0 1px 3px #000;animation:floatup .9s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-60%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-220%)}}
.stage-lines{max-height:150px;overflow:auto;font-size:12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:4px 0;margin-bottom:8px}
.sline{display:flex;justify-content:space-between;gap:10px;padding:2px 0;animation:slidein .18s ease-out}
.sline.yaku{color:var(--accent);font-weight:600} .sline.tal{color:var(--info)} .sline.bad{color:var(--bad)}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ===== Realistic tiles: a lit ivory face with bevelled edges on a coloured back slab, symbols engraved into the face ===== */
.tile{--slab:6px;

  border-radius:7px;border:1px solid #cdbb90;background:radial-gradient(130% 95% at 28% 12%,#fffcf3 0%,#f7efdc 42%,#ebdfc3 100%);box-shadow:var(--bev),var(--body)}

.stage-tiles .tile.hit,#hand .tile.hit,#open .tile.hit{box-shadow:var(--bev),var(--body),0 0 0 2px var(--accent),0 0 16px var(--accent)}

.tile.back{--body:0 1.5px 0 var(--tile-back2),0 3px 0 #efe3c6,0 calc(var(--slab) - 1px) 0 #d9c79e,0 var(--slab) 0 #b9a77e,0 calc(var(--slab) + 4px) 8px rgba(0,0,0,.45);

<script>
'use strict';
// ===================== CONFIG (tune here while playtesting) =====================
const CFG = {
  handSize: 17,          // tiles held; a complete hand still uses 14 of them
  playsPerBlind: 5,
  discardsPerBlind: 5,
  maxDiscardTiles: 7,
  startMoney: 8,
  talismanSlots: 5,
  consumableSlots: 2,
  antes: 8,
  anteBase: [250, 700, 2000, 4500, 9000, 16000, 28000, 45000],
  blindMult: { small: 1, big: 1.5, boss: 2 },
  blindReward: { small: 3, big: 4, boss: 5 },
  interestPer: 5, interestCap: 5,
  rerollCost: 5,
  // Base values per play type. Scrolls of Mastery add +10 chips and +1 Han per level.
  meldBase: { single: { chips: 0, han: 0 }, pair: { chips: 5, han: 0 }, twopair: { chips: 15, han: 1 }, chi: { chips: 10, han: 1 }, pon: { chips: 20, han: 1 }, kan: { chips: 40, han: 2 }, hand: { chips: 120, han: 2 } },
  // Multi-meld plays ("ladder B"). Key = melds,pair. A single meld + pair uses the meld's base +10 chips.
  rungs: { '2,0': { name: 'Two Melds', chips: 30, han: 1 }, '2,1': { name: 'Two Melds + Pair', chips: 40, han: 1 }, '3,0': { name: 'Three Melds', chips: 60, han: 2 }, '3,1': { name: 'Ready Hand', chips: 80, han: 2 }, '4,0': { name: 'Four Melds', chips: 100, han: 2 }, '4,1': { name: 'Four Melds + Pair', chips: 110, han: 2 } },
  kanBonus: { chips: 20, han: 1 },   // per Kan inside a multi-meld play
  // Optional pair ladder (experiment): plays of 3-6 different pairs with no melds. Off by default.
  pairLadder: false,
  pairRungs: { 3: { name: 'Three Pair', chips: 25, han: 1 }, 4: { name: 'Four Pair', chips: 40, han: 1 }, 5: { name: 'Five Pair', chips: 55, han: 2 }, 6: { name: 'Six Pair', chips: 70, han: 2 } },
  scrollChips: 10, scrollHan: 1,
  // Han -> multiplier. Index = Han. 13+ = x100.
  // Playtest 2: hand 17 (was 14), 5 discards (was 3), up to 7 tiles per discard (was 5).
  // Playtest 7: multi-meld ladder, complete hand 120 chips / 2 Han + Yaku, targets re-based to 300…45000.
  // Playtest 10: Furiten applies only to the winning tile (the newest tile drawn into the played hand).
  // Playtest 15: 5 Plays (was 4), start ¥8 (was ¥4), Ante 1-2 targets 250/700 (were 300/800), Loan Shark charges per Discard action.
  // Playtest 16: Declare Kan (closed), replacement draw after any Kan, Rinshan Kaihou.
  // Playtest 17: Talisman editions (Foil / Holographic / Polychrome), Red Seal and Glass engravings, live score preview.
  // Playtest 23: Talismans fire in slot order after the Han table; flat +Mult class; drag to reorder Talismans.
  hanTable: [1, 2, 4, 8, 15, 15, 25, 25, 40, 40, 40, 60, 60, 100],
  tierNames: ['None', 'Standard', 'Advanced', 'Master', 'Mangan', 'Mangan', 'Haneman', 'Haneman', 'Baiman', 'Baiman', 'Baiman', 'Sanbaiman', 'Sanbaiman', 'Yakuman'],
  shopWeights: { talisman: 0.5, omikuji: 0.35, kami: 0.15 },
};
function hanMult(h) { h = Math.max(0, Math.floor(h)); return h >= 13 ? 100 : CFG.hanTable[h]; }
function tierName(h) { h = Math.max(0, Math.floor(h)); return h >= 13 ? 'Yakuman' : CFG.tierNames[h]; }

// ===================== TILES =====================
const SUITS = ['m', 'p', 's', 'z'];
const HONOR_NAMES = ['', '東', '南', '西', '北', '白', '發', '中'];
const HONOR_EN = ['', 'East', 'South', 'West', 'North', 'White', 'Green', 'Red'];
const SUIT_GLYPH = { m: '萬', p: '筒', s: '索' };
const SUIT_EN = { m: 'Man', p: 'Pin', s: 'Sou' };
const MELD_LABEL = { single: 'Lone Tile', pair: 'Pair', twopair: 'Two Pair', chi: 'Chi', pon: 'Pon', kan: 'Kan', hand: 'Complete Hand' };
// Display name for a play type as stored in the run stats ('hand', 'chi', 'rung31', ...).
function rungLabel(k) { return MELD_LABEL[k] || (CFG.rungs[String(k).replace('rung', '').split('').join(',')] || {}).name || k; }
function topEntry(obj) { let best = null, n = 0; for (const [k, v] of Object.entries(obj || {})) if (v > n) { n = v; best = k; } return best ? [best, n] : null; }
const ORPHANS = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
let tileSeq = 0;
function mkTile(suit, rank, red = false) { return { id: ++tileSeq, suit, rank, red, eng: null }; }
function key(t) { return t.suit + t.rank; }
function isHonor(t) { return t.suit === 'z'; }
function isWind(t) { return t.suit === 'z' && t.rank <= 4; }
function isDragon(t) { return t.suit === 'z' && t.rank >= 5; }
function isTerminal(t) { return t.suit !== 'z' && (t.rank === 1 || t.rank === 9); }
function idx(t) { return SUITS.indexOf(t.suit) * 9 + t.rank - 1; }
function tileFromIdx(i) { return { id: 0, suit: SUITS[Math.floor(i / 9)], rank: i % 9 + 1, red: false, eng: null }; }
function tileName(t) { return isHonor(t) ? HONOR_EN[t.rank] + (t.rank <= 4 ? ' Wind' : ' Dragon') : `${t.red ? 'Red ' : ''}${t.rank} ${SUIT_EN[t.suit]}`; }
// ===================== DECKS & STAKES =====================
const DECKS = {
  standard: { name: 'Standard Wall', desc: '136 tiles: four of every tile, four Red Fives.' },
  red: { name: 'Vermilion Wall', desc: 'Every 5 is a Red Five: twelve of them.' },
  lean: { name: 'Lean Wall', desc: 'No Souzu. 100 tiles across two suits and honors, so hands come faster, but −1 Play every Blind. Sanshoku is impossible.' },
  monk: { name: "Monk's Wall", desc: 'No Honor tiles. 108 tiles and flushes come easily, but every blind target is ×2. Honor Yaku are impossible.' },
  gambler: { name: "Gambler's Wall", desc: '+1 Play and −1 Discard every Blind.' },
  merchant: { name: "Merchant's Wall", desc: `Start with ¥${CFG.startMoney + 16} and +1 consumable slot, but shop prices are +25%.` },
  abundant: { name: 'Abundant Wall', desc: '+2 hand size, −1 Play every Blind.' },
};
const STAKES = {
  white: { name: 'White Stake', desc: 'The standard game.' },
  red: { name: 'Red Stake', desc: 'Small Blinds give no reward money.' },
  green: { name: 'Green Stake', desc: 'Everything in Red Stake, and every blind target is ×1.3.' },
  black: { name: 'Black Stake', desc: 'Everything in Green Stake, and Talismans cost ¥2 more.' },
};
function buildDeck(deckKey = 'standard') {
  const d = []; const suits = deckKey === 'lean' ? ['m', 'p'] : ['m', 'p', 's'];
  for (const s of suits) for (let r = 1; r <= 9; r++) for (let c = 0; c < 4; c++) {
    const red = r === 5 && (deckKey === 'red' || c === 0 || (s === 'p' && c === 1));
    d.push(mkTile(s, r, red));
  }
  if (deckKey !== 'monk') for (let r = 1; r <= 7; r++) for (let c = 0; c < 4; c++) d.push(mkTile('z', r));
  return d;
}
function sortTiles(arr) {
  return arr.slice().sort((a, b) => SUITS.indexOf(a.suit) - SUITS.indexOf(b.suit) || a.rank - b.rank || (b.red ? 1 : 0) - (a.red ? 1 : 0));
}
function nextDora(i) {
  if (i < 27) { const s = Math.floor(i / 9), r = i % 9; return s * 9 + ((r + 1) % 9); }
  if (i < 31) return 27 + ((i - 27 + 1) % 4);
  return 31 + ((i - 31 + 1) % 3);
}
// Run RNG: seeded (mulberry32, state kept in S so saves replay) or Math.random when no run is active.
function rand() { if (typeof S === 'undefined' || !S || S.rngState === undefined) return Math.random(); let t = (S.rngState = (S.rngState + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function hashSeed(str) { let h = 2166136261 >>> 0; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function randomSeed() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 7; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(rand() * a.length)]; }

// ===================== ENGRAVINGS =====================
const ENG = {
  gold: { name: 'Gold Foil', short: 'G', desc: 'Earn ¥1 whenever this tile scores.' },
  obsidian: { name: 'Obsidian Inlay', short: 'O', desc: '+20 Chips when this tile scores.' },
  dragonmark: { name: 'Dragon Mark', short: 'D', desc: '+1 Han when this tile scores.' },
  jade: { name: 'Jade Inlay', short: 'J', desc: 'x1.5 Mult when this tile scores.' },
  redseal: { name: 'Red Seal', short: 'S', desc: 'This tile scores twice.' },
  glass: { name: 'Glass', short: 'Gl', desc: 'x2 Mult when this tile scores, but a 1 in 4 chance it shatters and leaves your Wall.' },
  steel: { name: 'Steel Inlay', short: 'St', desc: 'x1.5 Mult on every play while this tile stays in your hand (it scores nothing when played).' },
};
// Talisman editions (Balatro's Foil / Holographic / Polychrome). Rolled in the shop; price added to the Talisman's cost.
const EDITIONS = {
  foil: { name: 'Foil', chips: 50, price: 2, odds: 0.10, desc: '+50 Chips' },
  holo: { name: 'Holographic', han: 1, price: 3, odds: 0.06, desc: '+1 Han' },
  poly: { name: 'Polychrome', xmult: 1.5, price: 5, odds: 0.03, desc: 'x1.5 Mult' },
  neg: { name: 'Negative', slots: 1, price: 4, odds: 0.02, desc: '+1 Talisman slot' },
};
function rollEdition() { const r = rand(); let acc = 0; for (const [k, e] of Object.entries(EDITIONS)) { acc += e.odds; if (r < acc) return k; } return null; }

// Rule switches set from the run state (Hashi: a Chi may skip one rank).
let GAP_CHI = false;
function setRules(S) { GAP_CHI = !!(S && S.talismans && S.talismans.includes('hashi')); }
const CHI_SHAPES = () => GAP_CHI ? [[0, 1, 2], [0, 1, 3], [0, 2, 3]] : [[0, 1, 2]];
function meldType(tiles) {
  const n = tiles.length;
  if (n < 3 || n > 4) return null;
  const k = key(tiles[0]);
  if (tiles.every(t => key(t) === k)) return n === 3 ? 'pon' : 'kan';
  if (n !== 3) return null;
  if (tiles.some(isHonor)) return null;
  const s = tiles[0].suit; if (!tiles.every(t => t.suit === s)) return null;
  const r = tiles.map(t => t.rank).sort((a, b) => a - b);
  if (r[1] === r[0] + 1 && r[2] === r[1] + 1) return 'chi';
  if (GAP_CHI && r[0] !== r[1] && r[1] !== r[2] && r[2] - r[0] === 3) return 'chi';
  return null;
}
// Partition a selection into up to 4 melds (Chi/Pon/Kan) plus at most one pair, or exactly two pairs with no melds (Two Pair),
// covering every tile. Prefers more melds, then Kans. Returns {melds:[{type,i}], pairs:[i...], single:bool} or null.
function partitionPlay(tiles) {
  if (!tiles.length) return null;
  if (tiles.length === 1) return { melds: [], pairs: [], single: true };
  const counts = new Array(34).fill(0); for (const t of tiles) counts[idx(t)]++;
  let best = null;
  function rec(i, melds, pairs) {
    while (i < 34 && counts[i] === 0) i++;
    if (i >= 34) { if (pairs.length >= 2 && melds.length) return; const sc = melds.length * 10 + pairs.length + melds.filter(m => m.type === 'kan').length * 0.1; if (!best || sc > best.sc) best = { melds: melds.slice(), pairs: pairs.slice(), sc }; return; }
    if (melds.length < 4) {
      if (counts[i] >= 4) { counts[i] -= 4; melds.push({ type: 'kan', i }); rec(i, melds, pairs); melds.pop(); counts[i] += 4; }
      if (counts[i] >= 3) { counts[i] -= 3; melds.push({ type: 'pon', i }); rec(i, melds, pairs); melds.pop(); counts[i] += 3; }
      if (i < 27) for (const sh of CHI_SHAPES()) { const a = i + sh[1], b = i + sh[2]; if ((i % 9) + sh[2] > 8 || !counts[a] || !counts[b]) continue; counts[i]--; counts[a]--; counts[b]--; melds.push({ type: 'chi', i, shape: sh }); rec(i, melds, pairs); melds.pop(); counts[i]++; counts[a]++; counts[b]++; }
    }
    if (pairs.length < (CFG.pairLadder ? 6 : 2) && counts[i] >= 2) { counts[i] -= 2; pairs.push(i); rec(i, melds, pairs); pairs.pop(); counts[i] += 2; }

function rungInfo(part) {

  const m = part.melds.length, p = part.pairs.length ? 1 : 0;
  if (m === 0) { const np = part.pairs.length; if (np >= 3 && CFG.pairRungs[np]) { const r = CFG.pairRungs[np]; return { key: 'pairs' + np, name: r.name, chips: r.chips, han: r.han }; } return np === 2 ? { key: 'twopair', name: MELD_LABEL.twopair, ...CFG.meldBase.twopair } : { key: 'pair', name: MELD_LABEL.pair, ...CFG.meldBase.pair }; }

function decompose(counts, need) {

function hanTableText() {

function fullRulesHTML() {

  <p><b>Setup.</b> A new run lets you choose a Wall (deck), a Stake (difficulty) and a seed. Sharing a seed replays the same Wall, shops and bosses for players with the same unlocks. Each Stake keeps every penalty of the ones below it. Winning on a Stake with a Wall unlocks the next Stake for that Wall.</p>

  <p><b>Arranging.</b> Drag hand tiles to reorder them. Dragging turns off auto-sort; Sort Hand sorts again. Tiles score in the order they sit, which matters for Shikigami. Sorting also works against The Purist, so face-down tiles sit in their sorted place. A selection with face-down tiles always plays: if it isn't a valid play, its best part scores and the other selected tiles go to the River.</p>
  <p><b>Saving.</b> Your run saves automatically after every action. Run Info, Profile tab, keeps lifetime stats across runs. Settings, Your data, exports your profile, settings and current run as a code or file, so you can import them on another device or browser.</p>

  <p><b>Tile numbers.</b> Characters show their number and Winds their letter in the corner. Dots and Bamboo have none by default, since you count their pips. Settings can show numbers on all tiles or on none.</p>
  <p><b>Keys.</b> Enter or P plays, D discards, C calls, K declares a Kan, Esc clears your selection. Click anywhere or press any key while a play scores to skip the animation. Esc or a click outside closes Rules, Wall, Run Info and Settings.</p>
  </div>`;

  <p class="herotag">A Mahjong roguelite in the Balatro mould. Build hands, chase Yaku, stack Talismans, and outscore eight Antes of Yakuza bosses.</p>
  <div class="heroacts">${hasSave ? `<button id="mContinue" class="primary herobtn">Continue Run<span>${where}</span></button>` : ''}<button id="mStart" class="${hasSave ? 'ghost' : 'primary herobtn'}">New Run</button><button id="mRules" class="ghost">How to Play</button><button id="mCollection" class="ghost">Collection</button></div>
  <div class="herofoot muted">Playtest build · Riichi or Hong Kong terms in Settings</div></div>`;
}
// The intro screen's fan of honor tiles.
function fillHero(root) { const box = root && root.querySelector('#heroTiles'); if (!box || box.children.length) return; [[4, 1], [4, 2], [4, 3], [4, 7], [4, 4], [4, 5], [4, 6]].forEach(([, r], i, arr) => { const e = tileEl({ id: 0, suit: 'z', rank: r, red: false, eng: null }); const k = i - (arr.length - 1) / 2; e.style.transform = `rotate(${k * 7}deg) translateY(${Math.abs(k) * 5}px)`; e.style.cursor = 'default'; box.appendChild(e); }); }

// ===================== DEBUG =====================
function renderDebug() {
  const bar = $('#debugBar');
  bar.innerHTML = `<span class="label">Debug</span><button data-dbg="money">+¥25</button><button data-dbg="play">+1 Play</button><button data-dbg="discard">+1 Discard</button><button data-dbg="win">Win blind</button><button data-dbg="refill">Redraw hand</button>
  <select id="dbgBoss"><option value="">Set next boss…</option>${Object.entries(BOSSES).map(([k, b]) => `<option value="${k}">${b.name}</option>`).join('')}</select>
  <select id="dbgTal"><option value="">Add talisman…</option>${TALISMANS.map(t => `<option value="${t.key}">${t.name}</option>`).join('')}</select>
  <select id="dbgCon"><option value="">Add consumable…</option>${[...OMIKUJI, ...KAMI].map(t => `<option value="${t.key}">${t.name}</option>`).join('')}</select>
  <select id="dbgScr"><option value="">Add scroll…</option>${SCROLLS.map(t => `<option value="${t.key}">${t.name}</option>`).join('')}</select>
  <select id="dbgFlw"><option value="">Add flower…</option>${FLOWERS.map(t => `<option value="${t.key}">${t.name}</option>`).join('')}</select>
  <select id="dbgEd"><option value="">Edition for selected Talisman…</option>${Object.entries(EDITIONS).map(([k, e]) => `<option value="${k}">${e.name}</option>`).join('')}<option value="none">None</option></select>
  <button data-dbg="demo" title="Stage a complete hand with Red Fives, engravings and Talismans, then press Play to watch it score">Demo hand</button>
  <button data-dbg="reset" class="ghost">Wipe save</button>`;
  bar.querySelectorAll('[data-dbg]').forEach(b => b.onclick = () => {
    const a = b.dataset.dbg;
    if (a === 'money') S.money += 25; else if (a === 'play') S.plays++; else if (a === 'discard') S.discards++;
    else if (a === 'win') { if (S.phase === 'blind') { S.score = S.target; winBlind(); } }
    else if (a === 'refill') { if (S.phase === 'blind') { S.wall.push(...S.hand); shuffle(S.wall); S.hand = []; S.selected = []; draw(); } }
    else if (a === 'demo') { stageDemoHand(); }
    else if (a === 'reset') { clearSave(); location.reload(); return; }
    render();
  });
  $('#dbgBoss').onchange = e => { const k = e.target.value; if (!k) return; const i = S.ante - 1; S.bossOrder[i] = k; if (S.phase === 'blind' && blindKind() === 'boss') { S.boss = k; } setMsg(`Boss for Ante ${S.ante} set to ${BOSSES[k].name}.`); render(); };
  $('#dbgTal').onchange = e => { const k = e.target.value; if (!k) return; if (S.talismans.length < talSlots() && !S.talismans.includes(k)) gainTalisman(k); e.target.value = ''; render(); };
  $('#dbgCon').onchange = e => { const k = e.target.value; if (!k) return; if (S.consumables.length < conSlots()) S.consumables.push({ kind: CONS[k].kind, key: k }); e.target.value = ''; render(); };
  $('#dbgScr').onchange = e => { const k = e.target.value; if (!k) return; buyFree({ kind: 'scroll', key: k }); e.target.value = ''; render(); };
  $('#dbgEd').onchange = e => { const k = e.target.value; if (!k || !S.selTal) return; if (k === 'none') delete S.editions[S.selTal]; else S.editions[S.selTal] = k; e.target.value = ''; render(); };
  $('#dbgFlw').onchange = e => { const k = e.target.value; if (!k) return; if (!S.flowers.includes(k)) S.flowers.push(k); e.target.value = ''; render(); };
}
// A staged complete hand that exercises every counter: chips (Obsidian tile, Daruma, Scroll chips), Han (four Yaku, Red Five, Dora,
// Dragon Mark, Scroll Han), and Mult (+Mult from Tengu, Kitsune and Kasa-obake, then x3 from Hannya and x1.5 from its Polychrome edition).
function stageDemoHand() {
  if (S.phase !== 'blind') { setMsg('Start a blind first, then stage the demo hand.', true); return render(); }
  S.wall.push(...S.hand); S.hand = []; S.open = []; S.pendingDiscard = 0; S.selected = []; S.river = [];
  const mk = (suit, rank, red, eng) => { const t = mkTile(suit, rank, !!red); t.eng = eng || null; t.d = ++S.drawSeq; return t; };
  // 234 Man, 234 Pin, 234 Sou (Sanshoku) + 678 Sou + pair of 5 Pin: Tanyao, Pinfu, Sanshoku Doujun
  const tiles = [mk('m', 2, false, 'obsidian'), mk('m', 3, false, 'redseal'), mk('m', 4), mk('p', 2), mk('p', 3), mk('p', 4, false, 'jade'), mk('s', 2), mk('s', 3), mk('s', 4), mk('s', 6, false, 'dragonmark'), mk('s', 7, false, 'gold'), mk('s', 8, false, 'glass'), mk('p', 5, true), mk('p', 5), mk('z', 1), mk('z', 7), mk('m', 9)];
  S.hand = tiles; S.sortHand = false;
  S.selected = tiles.slice(0, 14).map(t => t.id);
  for (let i = 0; i < 5; i++) S.river.push(mk('z', 2 + (i % 3)));                 // five River tiles feed Daruma
  const ind = mk('s', 1); S.indicators = [ind]; S.dora = [nextDora(idx(ind))];       // indicator 1 Sou makes every 2 Sou a Dora
  S.talismans = ['daruma', 'tengu', 'kitsune', 'kasaobake', 'hannya']; S.editions = { hannya: 'poly' }; S.talState.kasaobake = 6;
  S.scrolls.meld.chi = Math.max(S.scrolls.meld.chi || 0, 2); S.scrolls.meld.hand = Math.max(S.scrolls.meld.hand || 0, 1);
  if (S.target < 5000) S.target = 5000;
  setMsg('Demo hand staged: 14 tiles selected. Press Play to watch chips, Han and Mult build up.'); render();
}
function buyFree(it) { const m = S.money; S.money = 999; buy(it); S.money = m; }

// ===================== BOOT & EVENTS =====================
function copySeed(btn) {
  const txt = S.seed; const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1200); };
  try { navigator.clipboard.writeText(txt).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const r = document.createRange(); const code = btn.previousElementSibling; if (code) { r.selectNodeContents(code); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Selected'; setTimeout(() => { btn.textContent = 'Copy'; }, 1200); } }
}
function bindEvents() {
  $('#btnPlay').onclick = doPlay; $('#btnDiscard').onclick = doDiscard; $('#btnCall').onclick = doCall; $('#btnKan').onclick = doDeclareKan;
  $('#btnClear').onclick = () => { S.selected = []; S.selRiver = null; render(); };
  $('#btnSort').onclick = () => { S.sortHand = !S.sortHand; if (S.sortHand) S.hand = sortTiles(S.hand); render(); };

  // The Wall tile-stack in the side panel opens the Wall screen (the panel is redrawn on render, so the click is delegated).
  document.addEventListener('click', e => { if (e.target.closest('#wallBtn')) showModal(deckHTML(), true); });
  $('#btnRules').onclick = () => showModal(rulesHTML(), true);
  $('#btnCollection').onclick = () => showModal(collectionHTML(), true, 'colmodal');
  // Collection search filters the current tab by the cards' visible text (works in both terminologies).
  document.addEventListener('change', e => { if (e.target.id !== 'importFile' || !e.target.files[0]) return; const f = e.target.files[0]; const r = new FileReader(); r.onload = () => { $('#importCode').value = String(r.result || ''); $('#importFileName').textContent = f.name; }; r.readAsText(f); });
  document.addEventListener('input', e => { if (e.target.id !== 'colSearch') return; const q = e.target.value.trim().toLowerCase(); let shown = 0; document.querySelectorAll('#modal .colcard').forEach(c => { const ok = !q || c.innerText.toLowerCase().includes(q); c.hidden = !ok; if (ok) shown++; }); const none = document.querySelector('#modal .colnone'); if (none) none.hidden = shown > 0; });
  $('#btnYaku').onclick = () => showModal(yakuHTML(), true);

  $('#btnSettings').onclick = () => showModal(settingsHTML(), true);
  $('#btnNewRun').onclick = () => showModal(`<div class="shophead"><h2>Start a New Run?</h2></div><p class="muted" style="margin:4px 0 0">Your current run will be lost.</p><div class="shopfoot"><button id="mClose" class="ghost">Cancel</button><span style="flex:1"></span><button id="mNewRun" class="danger">New Run</button></div>`, true, 'confirmmodal');
  document.addEventListener('click', e => { const b = e.target.closest('[data-copyseed]'); if (b) copySeed(b); if (S && S.busy && skipArmed) skipAnim = true; });
  $('#overlay').addEventListener('click', e => {
    if (e.target === $('#overlay')) { if (modalClosable()) closeModal(); return; }
    const t = e.target.closest('button'); if (!t) return;
    if (t.id === 'mX') { closeModal(); return; }
    if (t.dataset.copyseed != null) return;
    if (t.dataset.tab) { infoTab = t.dataset.tab; showModal(yakuHTML(), true); return; }
    if (t.dataset.ctab) { const prev = $('#mClose') && $('#mClose').onclick; colTab = t.dataset.ctab; showModal(collectionHTML(), true, 'colmodal'); if (prev) $('#mClose').onclick = prev; return; }
    if (t.dataset.rtab) { const prev = $('#mClose') && $('#mClose').onclick; rulesTab = t.dataset.rtab; showModal(rulesHTML(), true); if (prev) $('#mClose').onclick = prev; return; }
    if (t.dataset.setlang) { setLang(t.dataset.setlang); showModal(settingsHTML(), true); return; }
    if (t.dataset.settilenums) { TILE_NUMS = t.dataset.settilenums; try { localStorage.setItem('yakuman.tilenums', TILE_NUMS); } catch (e) { } render(); showModal(settingsHTML(), true); return; }
    if (t.dataset.sethint) { HINTS[t.dataset.sethint] = !HINTS[t.dataset.sethint]; try { localStorage.setItem('yakuman.hints', JSON.stringify(HINTS)); } catch (e) { } render(); showModal(settingsHTML(), true); return; }
    if (t.dataset.setdots) { SHOW_DOTS = t.dataset.setdots === 'on'; try { localStorage.setItem('yakuman.dots', SHOW_DOTS ? 'on' : 'off'); } catch (e) { } render(); showModal(settingsHTML(), true); return; }
    if (t.dataset.setspeed) { ANIM_SPEED = t.dataset.setspeed; try { localStorage.setItem('yakuman.speed', ANIM_SPEED); } catch (e) { } showModal(settingsHTML(), true); return; }
    if (t.dataset.setdbg) { const b = $('#debugBar'); b.hidden = t.dataset.setdbg !== 'on'; if (!b.hidden) renderDebug(); showModal(settingsHTML(), true); return; }
    if (t.dataset.setunlock) { UNLOCK_ALL = t.dataset.setunlock === 'on'; try { localStorage.setItem(UNLOCK_ALL_KEY, UNLOCK_ALL ? 'on' : 'off'); } catch (e) { } render(); showModal(settingsHTML(), true); return; }
    if (t.id === 'mDeleteRun') { showModal(`<div class="shophead"><h2>Delete Run?</h2></div><p class="muted" style="margin:4px 0 0">The run in progress ends and can't be continued. Your profile, unlocks and settings stay.</p><div class="shopfoot"><button id="mClose" class="ghost">Cancel</button><span style="flex:1"></span><button id="mConfirmDeleteRun" class="danger">Delete Run</button></div>`, true, 'confirmmodal'); backToSettings(); return; }
    if (t.id === 'mConfirmDeleteRun') { clearSave(); S = null; location.reload(); return; }
    if (t.id === 'mExport') { (async () => { EXPORT_CODE = await toCode(exportPayload()); showModal(exportHTML(), true, 'datamodal'); backToSettings(); })(); return; }
    if (t.id === 'mImport') { PENDING_IMPORT = null; showModal(importHTML(), true, 'datamodal'); backToSettings(); return; }
    if (t.id === 'mCopyCode') { const ta = $('#saveCode'); const done = () => { t.textContent = 'Copied'; setTimeout(() => { t.textContent = 'Copy Code'; }, 1400); }; const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { t.textContent = 'Selected: press Copy'; } }; try { navigator.clipboard.writeText(EXPORT_CODE).then(done, fallback); } catch (e) { fallback(); } return; }
    if (t.id === 'mDownloadCode') { saveCodeFile(t); return; }
    if (t.id === 'mLoadSave') { (async () => { try { PENDING_IMPORT = checkSave(await fromCode(($('#importCode') || {}).value)); showModal(importHTML(), true, 'datamodal'); backToSettings(); } catch (e) { const code = ($('#importCode') || {}).value || ''; showModal(importHTML(e.message || 'That save could not be read.'), true, 'datamodal'); backToSettings(); $('#importCode').value = code; } })(); return; }
    if (t.id === 'mConfirmImport') { const o = PENDING_IMPORT; if (!o) return; try { localStorage.setItem(PROFILE_KEY, JSON.stringify(Object.assign(blankProfile(), o.profile))); for (const [k, v] of Object.entries(o.settings || {})) if (SETTING_KEYS.includes(k)) localStorage.setItem(k, v); if (o.run) localStorage.setItem(SAVE_KEY, o.run); else localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); return; }
    if (t.id === 'mResetProfile') { showModal(`<div class="shophead"><h2>Reset Profile?</h2></div><p class="muted" style="margin:4px 0 0">Lifetime stats in this browser will be cleared and every unlock will lock again (${unlockedCount()} of ${UNLOCKS.length} unlocked). Your current run and settings stay. Export first if you want a copy.</p><div class="shopfoot"><button id="mClose" class="ghost">Cancel</button><span style="flex:1"></span><button id="mConfirmReset" class="danger">Reset Profile</button></div>`, true, 'confirmmodal'); backToSettings(); return; }
    if (t.id === 'mConfirmReset') { PROFILE = blankProfile(); saveProfile(); showModal(settingsHTML(), true); return; }
    if (t.id === 'mClose') { if (!t.onclick) { hideModal(); render(); } }   // a custom back action (to the menu or Settings) has already run
    else if (t.id === 'mEndless') { S.endless = true; ensureBosses(); genShop(); S.phase = 'cashout'; setMsg(''); render(); }
    else if (t.id === 'mNewRun' || t.id === 'mStart') { showModal(setupHTML(), true, 'setupmodal'); }
    else if (t.dataset.nav || t.dataset.goto) { const [name, d] = (t.dataset.nav || t.dataset.goto).split(':'); const seed = ($('#seedInput') || {}).value || ''; const before = setupKeys(name).indexOf(setupKey(name)); if (t.dataset.nav) setupSel[name] += +d; else setupSel[name] = +d; setupDir[name] = t.dataset.nav ? +d : Math.sign(+d - before); showModal(setupHTML(), true, 'setupmodal'); $('#seedInput').value = seed; }
    else if (t.id === 'mStartRun') { if (lockOf('wall', setupKey('deck')) || stakeLock(setupKey('deck'), setupKey('stake'))) return; const deck = ($('#modal input[name=deck]') || {}).value, stake = ($('#modal input[name=stake]') || {}).value, seed = ($('#seedInput') || {}).value; hideModal(); newRun({ deck, stake, seed }); }
    else if (t.id === 'mContinue') { hideModal(); render(); }
    else if (t.id === 'mCollection') { showModal(collectionHTML(), true, 'colmodal'); $('#mClose').onclick = () => { showModal(menuHTML(!!load()), true, 'menumodal'); }; }
    else if (t.id === 'mRules') { showModal(rulesHTML() + '', true); $('#mClose').onclick = () => { showModal(menuHTML(!!load()), true, 'menumodal'); }; }
    else if (t.id === 'mCashOut') { S.phase = 'shop'; S.msg = ''; render(); }
    else if (t.id === 'mNext') { S.shop = null; S.pack = null; S.msg = ''; S.phase = 'select'; render(); }
    else if (t.id === 'mPlayBlind') { S.msg = ''; startBlind(); render(); }
    else if (t.id === 'mRunInfo') { showModal(yakuHTML(), true); $('#mClose').onclick = () => { modalPinned = false; render(); }; }
    else if (t.id === 'mReroll') reroll();
    else if (t.id === 'mSkip') skipBlind();
    else if (t.dataset.freepack != null) { const pk = S.shop.freePacks.splice(+t.dataset.freepack, 1)[0]; openPack(pk, true); render(); }
    else if (t.dataset.take != null) takeFromPack(+t.dataset.take);
    else if (t.dataset.packuse != null) usePackCard(+t.dataset.packuse);
    else if (t.id === 'mPackDone') { S.pack = null; render(); }
    else if (t.id === 'mDeck') { showModal(deckHTML(), true); $('#mClose').onclick = () => { modalPinned = false; render(); }; }
    else if (t.dataset.buy != null) { const items = [...S.shop.cards, S.shop.scroll, S.shop.flower, S.shop.pack].filter(Boolean); buy(items[+t.dataset.buy]); }
    else if (t.dataset.sell) sellTalisman(t.dataset.sell);
    else if (t.dataset.sellcon != null) sellConsumable(+t.dataset.sellcon);
    else if (t.dataset.usecon != null) useConsumable(+t.dataset.usecon);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modalClosable()) { closeModal(); return; }
    if (S.phase !== 'blind' || !$('#overlay').hidden) return;
    if (S.busy) { if (skipArmed) skipAnim = true; return; }
    if (e.key === 'Enter' || e.key === 'p') doPlay(); else if (e.key === 'd') doDiscard(); else if (e.key === 'c') doCall(); else if (e.key === 'k') doDeclareKan(); else if (e.key === 'Escape') { S.selected = []; S.selRiver = null; render(); }
  });
}
function boot(saved) {
  bindEvents();
  if (saved && saved.phase && saved.deck) { S = saved; S.talState = S.talState || {};
    // Resume the tile id counter above every id in the saved run, so tiles created later never collide with existing ones.
    let maxId = 0; for (const t of [...S.deck, ...S.hand, ...S.wall, ...S.river, ...S.played, ...(S.indicators || []), ...S.open.flatMap(m => m.tiles)]) if (t.id > maxId) maxId = t.id; tileSeq = Math.max(tileSeq, maxId);
    // Repair any duplicates an older save may already contain
    const seen = new Set(); for (const zone of [S.hand, S.wall, S.river, S.played, S.deck, S.indicators || [], ...S.open.map(m => m.tiles)]) for (const t of zone) { if (seen.has(t.id)) t.id = ++tileSeq; seen.add(t.id); } S.editions = S.editions || {}; S.seed = S.seed || 'legacy'; S.deckKey = S.deckKey || 'standard'; S.stake = S.stake || 'white'; if (S.rngState === undefined) S.rngState = hashSeed(S.seed + Date.now()); S.stats.rungs = S.stats.rungs || {}; S.stats.yaku = S.stats.yaku || {}; S.stats.bosses = S.stats.bosses || []; S.tags = S.tags || []; if (!S.skipTags) S.skipTags = { small: pick(Object.keys(TAGS)), big: pick(Object.keys(TAGS)) }; S.stats.skipped = S.stats.skipped || 0; S.stats.calls = S.stats.calls || 0; S.stats.kans = S.stats.kans || 0; S.stats.discards = S.stats.discards || 0; S.busy = false; S.newIds = []; S.drawSeq = S.drawSeq || 0; render(); showModal(menuHTML(true), true, 'menumodal'); }
  else { S = newState(); PROFILE.runs++; saveProfile(); startBlind(); render(); showModal(menuHTML(false), true, 'menumodal'); }
}
try { if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => S); } catch (e) { }
const hotData = (window.claude && window.claude.hot && window.claude.hot.data) || null;
boot(hotData && hotData.phase ? hotData : load());
</script></body></html>

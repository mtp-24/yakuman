<div id="app">
<header>
  <h1 data-notr>Tenpai<span>MAHJONG ROGUELITE · PLAYTEST BUILD</span></h1>
  <div class="spacer"></div>
  <nav class="hdr-nav">
    <button id="btnYaku" data-notr>Run Info</button>
    <button id="btnCollection">Collection</button>
    <button id="btnRules">Rules</button>
    <button id="btnSettings" class="ghost" title="Terminology, helper, debug tools">Settings</button>
    <button id="btnNewRun" class="ghost">New Run</button>
  </nav>
</header>
<main>
  <aside>
    <div class="card" id="blindCard"></div>
    <div class="card lastplay" id="lastPlay"></div>
  </aside>
  <section class="board">
    <div class="zone talzone">
      <div class="talcols">
        <div class="talcol">
          <div class="zhead"><span class="label">Talismans</span><span class="muted" id="talCount"></span><span class="spacer" style="flex:1"></span><span id="talSell"></span></div>
          <div class="slots" id="talismans"></div>
        </div>
        <div class="talcol concol">
          <div class="zhead"><span class="label">Consumables</span><span class="muted" id="conCount"></span><span class="spacer" style="flex:1"></span><span id="conSell"></span></div>
          <div class="slots" id="consumables"></div>
        </div>
      </div>
    </div>
    <div class="zone-row">
    <div class="zone">
      <div class="zhead"><span class="label">Open Melds</span><span class="muted" id="openInfo"></span></div>
      <div class="row-tiles" id="open"></div>
    </div>
    <div class="zone">
      <div class="zhead"><span class="label">The River</span><span class="muted" id="riverInfo">Discards stay here all Blind. Select one plus 2–3 hand tiles to Call.</span></div>
      <div class="row-tiles" id="river"></div>
    </div>
    </div>
    <div class="zone handzone" id="handZone">
      <div class="callbanner" id="callBanner" hidden></div>
      <div class="zhead"><span class="label">Hand</span><span class="muted" id="handInfo"></span><span style="flex:1"></span><button id="btnClear" class="ghost" style="padding:3px 8px;font-size:12px" title="Clear your selection (Esc)">Clear Selection ✕</button><button id="btnSortMode" class="ghost" style="padding:3px 8px;font-size:12px">By Suit</button><button id="btnSort" class="ghost" style="padding:3px 8px;font-size:12px">Sort</button></div>
      <div class="row-tiles" id="hand"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="actions">
      <span class="actw"><button id="btnPlay" class="act act-play"><span class="act-k" aria-hidden="true">⏎</span><span class="act-t">Play</span><span class="act-s" id="playSub"></span><span class="act-pips" id="playPips"></span></button></span>
      <span class="actw"><button id="btnDiscard" class="act act-discard"><span class="act-k" aria-hidden="true">D</span><span class="act-t" id="discTitle">Discard</span><span class="act-s" id="discSub"></span><span class="act-pips" id="discPips"></span></button></span>
      <span class="act-sep" aria-hidden="true"></span>
      <span class="actw"><button id="btnCall" class="act act-call"><span class="act-k" aria-hidden="true">C</span><span class="act-t">Call</span><span class="act-s" id="callSub"></span></button></span>
      <span class="actw"><button id="btnKan" class="act act-kan"><span class="act-k" aria-hidden="true">K</span><span class="act-t">Declare Kan</span><span class="act-s" id="kanSub"></span></button></span>
      <span class="msg" id="msg"></span>
    </div>
    <div class="preview" id="preview"></div>
  </section>
</main>
<div class="debug" id="debugBar" hidden></div>
</div>
<div id="overlay" class="overlay" hidden><div class="modal" id="modal"></div></div>
<div id="pop"></div>
<div id="stage" class="stage" hidden></div>

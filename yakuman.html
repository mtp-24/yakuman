<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tenpai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a dark felt table. Left rail = blind status, right = the board (talismans, open melds, river, hand). Shop and menus are full overlays. */
:root{
  --bg:#0d1714; --felt:#15302a; --felt2:#1b3b33; --panel:#1a2420; --panel2:#22302b; --line:#2f4740;
  --fg:#efe6d2; --muted:#9db0a6; --accent:#d9a441; --accent2:#c9453a; --good:#6fcf97; --bad:#e86b5f; --info:#7fb3e0;
  --tile:#f4ecd8; --tile2:#e2d6b8; --tile-edge:#b9ab86; --tile-back:#2b5c8f; --tile-back2:#1d3f63;
  --man:#9b2d1f; --pin:#1f4f8f; --sou:#2e7d4f; --redfive:#d12c1f; --ink:#1b1b1b;
  --display:'Shippori Mincho','Hiragino Mincho ProN','Noto Serif JP',Georgia,serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --tilefont:'Hiragino Mincho ProN','Noto Serif JP','Shippori Mincho','Yu Mincho',serif;
  --tw:clamp(52px,5.4vw,84px); --th:calc(var(--tw) * 1.36); --tws:clamp(42px,3.9vw,62px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;padding:7px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600}
button.danger{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.ghost{background:transparent}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Header */
header{display:flex;align-items:baseline;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .hdr-nav{align-self:center}
header h1{font-size:22px;letter-spacing:.04em;color:var(--accent)}
header h1 span{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400;letter-spacing:.1em;margin-left:8px}
header .spacer{flex:1}
header .hdr-stat{font-size:13px}
header .hdr-stat b{color:var(--accent)}
.hdr-nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hdr-nav button{padding:6px 10px;font-size:12px;white-space:nowrap}

/* Main table */
#app{display:flex;flex-direction:column;min-height:100%}
main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;padding:12px 16px;flex:1;min-width:0}
.zone-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px}
@media (max-width:1000px){.zone-row{grid-template-columns:1fr}}

aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.blind-name{font-family:var(--display);font-size:20px;color:var(--accent)}
.blind-name.boss{color:var(--accent2)}
.boss-desc{font-size:12px;color:var(--fg);background:rgba(201,69,58,.12);border:1px solid rgba(201,69,58,.4);border-radius:6px;padding:6px 8px;margin-top:6px}
.target{font-size:26px;font-family:var(--display);color:var(--fg)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f1cf7a);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.stat{background:var(--panel2);border-radius:6px;padding:6px 8px}
.stat .v{font-size:20px;font-family:var(--display)}
.stat.plays .v{color:var(--info)} .stat.discards .v{color:var(--bad)} .stat.money .v{color:var(--accent)}
.lastplay{font-size:12px}
.lastplay .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.lastplay .row:last-child{border-bottom:0}
.lastplay .total{font-size:18px;font-family:var(--display);color:var(--accent);margin-top:6px}
.lastplay .formula{color:var(--muted)}

.board{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone{background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;overflow:visible}
.zone .zhead{flex-wrap:nowrap;min-height:26px} .zone .zhead > .label{flex:none} .zone .zhead > .muted{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone .zhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.zone .zhead .label{color:#bfd0c6}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.concol{margin-top:8px}
/* Wide screens: Talismans and Consumables share one row, each column sized by its slot count so every slot is the same width */
@media (min-width:1100px){
  .talcols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,2fr);gap:8px}
  .concol{margin-top:0;padding-left:8px;border-left:1px dashed var(--line)}
  .talcols .slots{flex-wrap:nowrap} .talcols .slot{flex:1 1 0;min-width:0;max-width:none}
  .talcols .talcol{display:flex;flex-direction:column} .talcols .slots{flex:1 1 auto;align-items:stretch}
}
.slot{min-width:110px;min-height:50px;border:1px dashed var(--line);border-radius:8px;padding:5px 8px;background:rgba(0,0,0,.15);font-size:11px;flex:1 1 110px;max-width:200px}
.slot.filled{border-style:solid;border-color:var(--accent);background:var(--panel);cursor:pointer}
.slot.filled.sel{box-shadow:0 0 0 2px var(--accent)}
.slot.filled{touch-action:none;user-select:none}
.order{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:10px;font-family:var(--body);margin-right:6px;vertical-align:middle;letter-spacing:0}
.slot.dragging{z-index:30;opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 2px var(--accent);transition:none}
.slot.drop-before{box-shadow:-4px 0 0 0 var(--accent)} .slot.drop-after{box-shadow:4px 0 0 0 var(--accent)}
.sline.convert{color:var(--accent);border-top:1px dashed var(--line);margin-top:2px;padding-top:4px}
.slot .n{font-family:var(--display);color:var(--accent);font-size:14px}
.slot .kind{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:1px}
.hb-head{height:36px;display:flex;align-items:center;min-width:0;margin:-3px 0 6px}
.hb-head .hb-title{font-family:var(--display);color:var(--fg);line-height:1.15;font-size:22px;overflow-wrap:anywhere;font-weight:500}
.hb-head .hb-title.muted{color:var(--muted)}
.hb-head .hb-title .tag{font-family:var(--body);font-size:10px;vertical-align:middle;margin-left:4px}
.hb-head .hb-title.one,.hb-head .hb-tot{position:relative;top:-2px}
.hb-head .hb-tot{display:block;font-family:var(--display);font-size:32px;color:var(--accent);width:100%;text-align:center;line-height:36px;white-space:nowrap;overflow:hidden}
.slot .d{color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
.slot.kami .n{color:#c9a7e8} .slot.omikuji .n{color:var(--info)}
.row-tiles{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;min-height:calc(var(--th) + 8px)}
#open,#river{min-height:calc(var(--tws) * 1.36 + 8px)}
#hand{row-gap:20px;padding-top:12px}
.meld{display:flex;gap:2px;padding:4px;border-radius:6px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
.meld.closedmeld{border-color:var(--good)}
.meld .mt{font-size:10px;color:var(--muted);align-self:center;writing-mode:vertical-rl;margin-right:3px;letter-spacing:.1em;text-transform:uppercase}

/* Tiles */
.tile{position:relative;width:var(--tw);height:var(--th);border-radius:6px;background:linear-gradient(180deg,var(--tile),var(--tile2));border:1px solid var(--tile-edge);box-shadow:0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-family:var(--tilefont);cursor:pointer;user-select:none;transition:transform .12s;flex:0 0 auto}
.tile.small{--tw:var(--tws);--th:calc(var(--tws) * 1.36);box-shadow:0 2px 0 #8f815f}
.tile.small .rank{font-size:16px} .tile.small .suitg{font-size:12px} .tile.small .honor{font-size:22px}
.tile.sel{transform:translateY(-12px);box-shadow:0 3px 0 #8f815f,0 0 0 2px var(--accent),0 8px 14px rgba(0,0,0,.5)}
.tile.small.sel{transform:translateY(-6px)}
.tile.dim{opacity:.5}
#hand .tile{touch-action:none}
.tile.dragging{z-index:30;opacity:.9;box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 0 2px var(--accent);transition:none;cursor:grabbing}
.tile.drop-before{box-shadow:-4px 0 0 0 var(--accent),0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4)}
.tile.drop-after{box-shadow:4px 0 0 0 var(--accent),0 3px 0 #8f815f,0 4px 6px rgba(0,0,0,.4)}
.tile svg{width:100%;height:100%;display:block;padding:2px}
.sheet{width:100%;border-collapse:collapse;font-size:12px}
.sheet th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
.sheet td{padding:5px 8px;border-bottom:1px dashed var(--line);vertical-align:top}
.sheet td:nth-child(2){white-space:nowrap;color:var(--accent)}
.tile .rank{font-size:26px;font-weight:700;line-height:1}
.tile .suitg{font-size:16px;line-height:1.1}
.tile.m .suitg{color:var(--man)} .tile.p .suitg{color:var(--pin)} .tile.s .suitg{color:var(--sou)}
.tile.m .rank{color:var(--ink)} .tile.p .rank{color:var(--pin)} .tile.s .rank{color:var(--sou)}
.tile.red .rank{color:var(--redfive);text-shadow:0 0 6px rgba(209,44,31,.5)}
.tile .honor{font-size:32px;font-weight:700;line-height:1}
.tile .honor.h5{color:#1f4f8f;-webkit-text-stroke:1px #1f4f8f;color:transparent} .tile .honor.h6{color:#2e7d4f} .tile .honor.h7{color:#c9281c}
.tile.back{background:linear-gradient(180deg,var(--tile-back),var(--tile-back2));border-color:#13304d;box-shadow:0 3px 0 #0f2740,0 4px 6px rgba(0,0,0,.4)}
.tile.back::after{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.25);border-radius:4px}
/* Engraved tile faces */
.tile.eng-gold{background:linear-gradient(160deg,#fbeec1 0%,#e2c05e 45%,#c99a2e 100%);border-color:#9a7418;box-shadow:0 3px 0 #7d5c0f,0 4px 8px rgba(0,0,0,.4),0 0 10px rgba(226,192,94,.55)}
.tile.eng-gold .shine{position:absolute;inset:0;border-radius:6px;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%);pointer-events:none}
.tile.eng-obsidian{background:linear-gradient(160deg,#c3c8cf 0%,#8a9099 55%,#62676e 100%);border-color:#2b2f34;box-shadow:0 3px 0 #1f2226,0 4px 8px rgba(0,0,0,.5)}
.tile.eng-jade{background:linear-gradient(160deg,#dff3e6 0%,#9ad6b4 50%,#5fae88 100%);border-color:#2e7d4f;box-shadow:0 3px 0 #22573a,0 4px 8px rgba(0,0,0,.4)}
.tile.eng-steel{background:linear-gradient(160deg,#eef2f6 0%,#c3ccd5 45%,#8f9ca8 100%);border-color:#56657a;box-shadow:0 3px 0 #3d4a57,0 4px 8px rgba(0,0,0,.45)}
.tile.eng-steel .brush{position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px);pointer-events:none}
.tile.eng-glass{background:linear-gradient(160deg,rgba(238,247,255,.95) 0%,rgba(198,223,242,.9) 55%,rgba(169,203,230,.9) 100%);border-color:#86aecd;box-shadow:0 3px 0 #6f93ad,0 4px 6px rgba(0,0,0,.4),inset 0 0 12px rgba(255,255,255,.7)}
/* Seals: a small wax seal pressed on the tile's top edge, sized with the tile: a solid disc in the seal's colour with a cream
   rim, a darker pressed edge and a small cream star stamped in the middle */
.tile .seal{--s1:#e2463a;--s2:#9c1409;position:absolute;top:calc(var(--tw,48px) * -.08);left:50%;transform:translateX(-50%);width:clamp(10px,calc(var(--tw,48px) * .24),20px);aspect-ratio:1;height:auto;border-radius:50%;background:var(--s1);border:1.5px solid #f6ead2;box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1.5px var(--s2),inset 1px 1px 1px rgba(255,255,255,.35)}
.tile .seal::after{content:'';position:absolute;inset:24%;background:#fff3e0;opacity:.9;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.tile .seal.seal-gold{--s1:#f0c040;--s2:#9a6a08} .tile .seal.seal-blue{--s1:#4a95e0;--s2:#184f8e} .tile .seal.seal-purple{--s1:#a965e0;--s2:#5a2290}
.tile .dmark{position:absolute;top:4px;right:4px;width:11px;height:11px;transform:rotate(45deg);background:#c9281c;border:1.5px solid #ffd27a;box-shadow:0 0 4px rgba(201,40,28,.7)}
.tile .dmark::after{content:'';position:absolute;inset:3px;background:#ffd27a;transform:rotate(45deg);border-radius:1px}
.tile.small .seal{width:12px;top:-4px} .tile.small .dmark{width:9px;height:9px;top:3px;right:3px}
.tile.tiny .seal{width:10px;top:-3px;border-width:1px} .tile.tiny .dmark{width:7px;height:7px;top:2px;right:2px}
.tile.safe::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 4px var(--good)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.hint .hint-main{color:var(--fg);font-weight:600}
.hint .good{color:var(--good)} .hint .bad{color:var(--bad)}
.tile.called{outline:2px solid var(--info);outline-offset:-2px}
.dora-ind{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}

/* Actions */
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions button{padding:10px 16px;font-size:14px}
.msg{min-height:20px;font-size:13px;color:var(--accent)}
.msg.err{color:var(--bad)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(5,10,9,.86);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:900px;width:100%;min-width:0;position:relative}
.modal-x{position:sticky;top:0;float:right;margin:-8px -8px 0 8px;width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;z-index:2;background:var(--panel)}
.wallcount{color:var(--muted);margin-left:4px}
.modal h2{font-size:26px;color:var(--accent);margin-bottom:6px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0;align-items:stretch}
/* Pack screen: narrower so 8 tiles fit one row; only the tile row is centred, cards line up like the shop */
.modal.packmodal{max-width:760px}
.packmodal .packhand{justify-content:center}
.ptile{display:flex;flex-direction:column;align-items:center;gap:5px;width:min-content}
.pmark{font-size:10px;line-height:1.2;color:var(--accent);text-align:center;min-height:12px;font-weight:600}
.ptile.gone .pmark{color:var(--bad)}
.packhand .tile.marked{box-shadow:0 0 0 2px var(--accent),0 3px 0 #8f815f,0 0 12px rgba(217,164,65,.45)}
.packhand .tile.gone{opacity:.4;filter:grayscale(1);cursor:default}
.ptile.gone{position:relative} .ptile.gone::after{content:'';position:absolute;left:4%;right:4%;top:40%;height:3px;border-radius:2px;background:var(--bad);transform:rotate(-38deg);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.shopcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.shopcard .kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shopcard .n{font-family:var(--display);font-size:16px;color:var(--accent)}
.shopcard.kami .n{color:#c9a7e8} .shopcard.omikuji .n{color:var(--info)} .shopcard.scroll .n{color:var(--good)} .shopcard.flower .n{color:#f0a3b8}
.shopcard .d{font-size:12px;color:var(--fg)}
.shopcard .buy{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.shopcard .buy{min-height:39px;align-items:center}   /* same height with buttons, Sold, Used or No picks left */
.shopcard.sold{opacity:.4}
.menu-rules{columns:2;column-gap:24px;font-size:13px}
.quickrules{margin:4px 0 0;padding-left:22px;display:grid;gap:8px;font-size:14px;line-height:1.5;max-width:720px} .quickrules li::marker{color:var(--accent);font-family:var(--display);font-weight:700}
@media (max-width:700px){.menu-rules{columns:1}}
.menu-rules p{margin:0 0 8px;break-inside:avoid}
.packhandwrap{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;margin:0 0 10px}
.packhand{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;min-height:40px;container-type:inline-size} .packhand .tile{cursor:pointer;--tw:min(80px,calc((100cqw - 42px) / 8));--th:calc(var(--tw) * 1.36)}
@container (max-width: 480px){.packhand .tile{--tw:min(68px,calc((100cqw - 18px) / 4));--th:calc(var(--tw) * 1.36)}}
.lvline{font-size:12px;margin:6px 0 2px;padding:4px 8px;border-radius:6px;background:rgba(122,183,232,.1);border:1px solid rgba(122,183,232,.3)} .lvline b{color:var(--accent)}
.menu-rules h3{font-family:var(--display);font-size:16px;color:var(--accent);margin:4px 0 6px;break-after:avoid}
.deckrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;justify-items:center}
@media (max-width:600px){.deckrow{display:flex;flex-wrap:wrap}}
.modal:has(.deckwrap){max-width:640px}
.deckcell{text-align:center;font-size:11px;color:var(--muted);width:52px}
.deckcell .tile{margin:0 auto 2px;cursor:default}
.deckcell b{color:var(--fg)}
.debug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:12px}
.debug select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px}
.reward-list{display:grid;grid-template-columns:1fr auto;gap:4px 16px;max-width:360px;margin:10px 0}
.score-pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:44px;color:var(--accent);text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;z-index:15;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.score-pop{animation:none;opacity:1}}
.stage{position:fixed;inset:0;z-index:18;display:flex;align-items:center;justify-content:center;background:rgba(5,10,9,.55);padding:16px;cursor:pointer}
.stage-inner{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.stage-title{font-family:var(--display);font-size:18px;color:var(--accent);margin-bottom:8px}
.stage-tiles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;min-height:50px}
.stage-tiles .tile{transition:transform .12s}
.stage-tiles .tile.hit{transform:translateY(-8px) scale(1.12);box-shadow:0 2px 0 #8f815f,0 0 0 2px var(--accent),0 0 14px var(--accent)}
.stage-tiles .float{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-family:var(--body);font-weight:700;color:var(--accent);text-shadow:0 1px 3px #000;animation:floatup .9s ease-out forwards;pointer-events:none}

/* ===== Shop: noren banner, action rail, felt shelves, portrait cards with price tags ===== */
.modal.shopmodal{max-width:1000px;padding-top:0}
.noren{margin:0 -20px 18px;border-radius:12px 12px 0 0;overflow:hidden}
.norenbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 12px;background:radial-gradient(90% 140% at 15% 0%,rgba(255,255,255,.08),transparent 60%),linear-gradient(180deg,#74271f,#561b16)}
.norenbar::before{content:'';position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(#94713f,#5c4426);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.norenbar h2{margin:0;color:#f6ead2;font-size:30px;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.norenbar .wallet{border-color:rgba(246,234,210,.45);background:rgba(0,0,0,.22)} .norenbar .wallet .v{color:#f3c768} .norenbar .wallet .cur{color:rgba(246,234,210,.7)}
.norenflaps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;height:20px;background:var(--panel)} .norenflaps i{background:#561b16;border-radius:0 0 7px 7px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.shoplayout{display:grid;grid-template-columns:minmax(0,1fr) 172px;gap:18px;align-items:start} .shoprail{order:2}
.shoprail{display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.shoprail button{width:100%}
.nextbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;min-height:76px;font-size:17px;text-align:left;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,.35)} .nextbtn small{font-size:11px;font-weight:500;opacity:.75;line-height:1.3}


.shelf{position:relative;background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.05),transparent 60%),var(--felt);border:1px solid var(--line);border-radius:12px;padding:26px 14px 16px;margin:0 0 22px;box-shadow:inset 0 3px 12px rgba(0,0,0,.35)}
.shelf::after{content:'';position:absolute;left:10px;right:10px;bottom:-8px;height:8px;border-radius:0 0 8px 8px;background:linear-gradient(#7a5a34,#4a361f);box-shadow:0 4px 8px rgba(0,0,0,.35)}
.shelflabel{position:absolute;top:-10px;left:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--panel);padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.shelfrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.freepacks{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 10px}
.shelf .shopcard,.packmodal .shop-grid:not(.owned-grid) .shopcard{position:relative;padding:18px 12px 12px;border-radius:12px;min-height:248px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .15s,box-shadow .15s}
.shelf .shopcard:not(.sold):hover,.packmodal .shop-grid:not(.owned-grid) .shopcard:not(.sold):hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.shelf .shopcard .d,.packmodal .shop-grid:not(.owned-grid) .shopcard .d{font-size:12px;line-height:1.45}
.shelf .shopcard .n,.packmodal .shop-grid:not(.owned-grid) .shopcard .n{font-size:18px;line-height:1.2}
.shelf .shopcard .buy,.packmodal .shop-grid:not(.owned-grid) .shopcard .buy{justify-content:center} .shelf .shopcard .buy button{width:100%}
.emblem{width:50px;height:50px;margin:0 auto 2px;color:#ff9f43;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))} .emblem svg{width:100%;height:100%;display:block}
.pricetag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);z-index:2;background:linear-gradient(#ecc165,#c58f2c);color:#1b1b1b;font-weight:700;font-size:13px;padding:2px 12px 3px 18px;border-radius:5px;box-shadow:0 3px 6px rgba(0,0,0,.45);white-space:nowrap}
.pricetag::before{content:'';position:absolute;left:6px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--felt);box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
.pricetag.short{background:linear-gradient(#ef8075,#b8453a);color:#fff}
.shelf .shopcard.sold .pricetag{opacity:.6}
.soldnote{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.shelf .shopcard.pack{overflow:visible}
.shelf .shopcard.pack::before,.shelf .shopcard.pack::after{content:'';position:absolute;left:0;right:0;height:7px;background:linear-gradient(135deg,var(--felt) 33%,transparent 33%) 0 0/10px 10px,linear-gradient(225deg,var(--felt) 33%,transparent 33%) 0 0/10px 10px;pointer-events:none}
.shelf .shopcard.pack::before{top:-1px} .shelf .shopcard.pack::after{bottom:-1px;transform:scaleY(-1)}
.shelf .shopcard.flower::after{content:'';position:absolute;inset:5px;border:1px dashed rgba(240,163,184,.4);border-radius:9px;pointer-events:none}
.shelf .shopcard .scrolllv,.shelf .shopcard .talprev{text-align:left}
@media (max-width:720px){.shoplayout{grid-template-columns:1fr} .shoprail{order:-1;position:static;display:grid;grid-template-columns:1fr 1fr} .nextbtn{grid-column:1/-1;min-height:58px} .shelf .shopcard{min-height:0} .norenbar h2{font-size:24px} .shelfrow{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
/* ===== Pack header ===== */
.packhead{--pc:255,159,67;display:flex;align-items:center;gap:16px;margin:-20px -20px 16px;padding:18px 20px;border-radius:12px 12px 0 0;background:radial-gradient(80% 160% at 0% 0%,rgba(var(--pc),.3),transparent 65%),linear-gradient(180deg,rgba(var(--pc),.1),transparent);border-bottom:1px solid rgba(var(--pc),.35)}
.packhead.omikuji{--pc:127,179,224} .packhead.kami{--pc:201,167,232} .packhead.scroll{--pc:111,207,151} .packhead.talisman{--pc:217,164,65}
.packart{width:66px;height:66px;flex:0 0 auto;color:rgb(var(--pc));transform:rotate(-9deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))} .packart svg{width:100%;height:100%}
.packtitle{min-width:0;flex:1 1 220px} .packtitle h2{margin:2px 0 3px;color:rgb(var(--pc))} .packtitle p{margin:0;font-size:13px;line-height:1.45;opacity:.85}
.packpicks{flex:0 0 auto;text-align:center;border:1px solid rgba(var(--pc),.5);background:rgba(0,0,0,.18);border-radius:10px;padding:6px 14px 7px} .packpicks b{display:block;font-family:var(--display);font-size:30px;line-height:1;color:rgb(var(--pc))} .packpicks span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.packmodal .shop-grid:not(.owned-grid){grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
@media (max-width:560px){.packhead{flex-wrap:wrap} .packart{width:52px;height:52px}}
.packshelf{margin-top:18px} .packshelf .shop-grid{margin:0}
.endlessbadge{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);border:1px solid rgba(232,107,95,.5);background:rgba(232,107,95,.1);border-radius:999px;padding:3px 12px}

/* ===== Shared noren banner for every screen (the shop has its own) ===== */
.modal>.banner{--bn1:#74271f;--bn2:#561b16;--bnink:#f6ead2;position:relative;margin:-20px -20px 34px;padding:24px 22px 14px;border-radius:12px 12px 0 0;color:var(--bnink);
  background:radial-gradient(90% 160% at 12% 0%,rgba(255,255,255,.09),transparent 60%),linear-gradient(180deg,var(--bn1),var(--bn2))}
.modal>.banner::before{content:'';position:absolute;left:0;right:0;top:0;height:7px;border-radius:12px 12px 0 0;background:linear-gradient(#94713f,#5c4426);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.modal>.banner h2,.modal>.banner h2.lost{color:var(--bnink);margin:0;font-size:28px;letter-spacing:.02em;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.modal>.banner .label,.modal>.banner .muted,.modal>.banner .sub{color:rgba(246,234,210,.72)}
.modal>.banner .bannerflaps{position:absolute;left:0;right:0;top:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;height:18px} .modal>.banner .bannerflaps i{background:var(--bn2);border-radius:0 0 7px 7px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.modal>.banner.bn-indigo{--bn1:#2c3a72;--bn2:#1d264e} .modal>.banner.bn-teal{--bn1:#22564a;--bn2:#173b33} .modal>.banner.bn-ink{--bn1:#33393a;--bn2:#222727}
.modal>.banner.bn-gold{--bn1:#946f22;--bn2:#6a4e15;--bnink:#fff4da} .modal>.banner.bn-gold h2{text-shadow:0 0 18px rgba(255,220,140,.45),0 2px 6px rgba(0,0,0,.35)}
.modal>.banner input{background:rgba(0,0,0,.25);border-color:rgba(246,234,210,.3);color:var(--bnink)} .modal>.banner input::placeholder{color:rgba(246,234,210,.55)}
.modal>.banner .antepips i{background:rgba(246,234,210,.25)} .modal>.banner .antepips i.done{background:#f3c768} .modal>.banner .antepips i.now{border-color:#f3c768}
.modal>.banner .cashscore b{color:#bff3d1}
.modal.hasbanner .modal-x{z-index:5;float:none;display:flex;margin:-6px -6px -46px auto;background:rgba(0,0,0,.28);border-color:rgba(246,234,210,.35);color:#f6ead2}
.modal.hasbanner>.banner.shophead{padding-right:64px}
.overmodal>.banner,.cashmodal>.banner{text-align:left}
/* Ante screen chips */
.blindcard{position:relative} .blindchip{position:absolute;top:10px;right:10px;width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))} .blindchip svg{width:100%;height:100%;display:block}
.blindcard.done .blindchip{filter:grayscale(1);opacity:.5}
.selectmodal .blindcard{border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.04),transparent 60%),var(--panel2)}
.selectmodal .blindcard.current{background:radial-gradient(120% 90% at 0% 0%,rgba(217,164,65,.14),transparent 60%),var(--panel2)}
.selectmodal .blindcard.bosscard{background:radial-gradient(120% 90% at 0% 0%,rgba(201,69,58,.14),transparent 60%),var(--panel2)}
/* Shop rail buttons share one shape */
.railbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:50px;padding:10px 14px;border-radius:10px;border-color:var(--line)} .railbtn b{font-family:var(--display);font-size:17px;font-weight:500;color:var(--muted)}
.rerollbtn.railbtn b{color:var(--accent)}

/* ===== Balatro-style scoring: numbers pop and wobble; fireworks burst over the boxes ===== */
.hb-math .nv,.hanline{display:inline-block;transform-origin:50% 55%;will-change:transform}
@keyframes numpop{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.34) rotate(-7deg)}55%{transform:scale(.94) rotate(4deg)}80%{transform:scale(1.05) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
.boxwrap>.boxfoot{border-radius:0 0 8px 8px;position:relative;z-index:2} .capfoot .hantier{font-size:10px;opacity:.85;min-height:12px}
.chipfoot .hanline{color:#cfe3f6}
.handbox .hb-head{position:relative;z-index:3}
.handbox[data-fire="1"] .chipwrap,.handbox[data-fire="2"] .chipwrap,.handbox[data-fire="3"] .chipwrap{box-shadow:0 0 16px rgba(108,196,255,.5),inset 0 -3px 0 rgba(0,0,0,.25)}
.handbox[data-fire="1"] .multwrap,.handbox[data-fire="2"] .multwrap,.handbox[data-fire="3"] .multwrap{box-shadow:0 0 16px rgba(255,107,26,.55),inset 0 -3px 0 rgba(0,0,0,.25)}
@keyframes numsimmer{from{transform:rotate(-1.5deg) scale(1.02)}to{transform:rotate(1.5deg) scale(1)}}
/* ===== Next Blind: vermilion, glowing, with a light sweep so it never blends in with the gold Buy buttons ===== */
.shoprail .nextbtn.primary{position:relative;overflow:hidden;background:linear-gradient(180deg,#e0533f,#a8322a);border:1px solid #ff9a85;color:#fff6ea;min-height:86px;padding:16px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 10px 24px rgba(201,69,58,.45),inset 0 1px 0 rgba(255,255,255,.35);animation:nbglow 2.4s ease-in-out infinite}
.shoprail .nextbtn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.nextbtn .nb-main{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px;white-space:nowrap;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.02em;text-shadow:0 2px 4px rgba(0,0,0,.35)} .nextbtn .nb-main svg{transition:transform .2s} .nextbtn:hover .nb-main svg{transform:translateX(4px)}
.shoprail .nextbtn.primary small{color:rgba(255,246,234,.85);opacity:1}
.shoprail .nextbtn.primary::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:nbsweep 3.2s ease-in-out infinite}
@keyframes nbsweep{0%,55%{left:-60%}100%{left:130%}} @keyframes nbglow{0%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 10px 24px rgba(201,69,58,.4),inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 1px rgba(0,0,0,.35),0 10px 30px rgba(232,90,70,.7),inset 0 1px 0 rgba(255,255,255,.35)}}
@media (prefers-reduced-motion:reduce){.shoprail .nextbtn.primary,.shoprail .nextbtn.primary::after{animation:none}}

/* ===== Realistic tiles: a lit ivory face with bevelled edges on a coloured back slab, symbols engraved into the face ===== */
.tile{--slab:6px;
  --bev:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -3px 5px rgba(140,116,70,.22),inset 3px 0 3px -2px rgba(255,255,255,.7),inset -3px 0 4px -2px rgba(120,94,50,.28);
  --body:0 1.5px 0 #efe3c6,0 3px 0 #d9c79e,0 calc(var(--slab) - 1px) 0 var(--tile-back),0 var(--slab) 0 var(--tile-back2),0 calc(var(--slab) + 4px) 8px rgba(0,0,0,.45);
  border-radius:7px;border:1px solid #cdbb90;background:radial-gradient(130% 95% at 28% 12%,#fffcf3 0%,#f7efdc 42%,#ebdfc3 100%);box-shadow:var(--bev),var(--body)}
.tile::before{content:'';position:absolute;inset:1px 1px 45% 1px;border-radius:6px 6px 40% 40%/6px 6px 14px 14px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none;z-index:1}
.tile svg{position:relative;z-index:2;filter:drop-shadow(0 .7px 0 rgba(255,255,255,.9)) drop-shadow(0 -.5px .3px rgba(70,45,10,.35))}
.tile.small{--slab:5px;box-shadow:var(--bev),var(--body)} .tile.tiny{--slab:3px;box-shadow:var(--bev),var(--body);border-radius:5px}
.tile.sel{box-shadow:var(--bev),var(--body),0 0 0 2px var(--accent),0 16px 20px rgba(0,0,0,.4)}
.tile.dragging{box-shadow:var(--bev),var(--body),0 0 0 2px var(--accent),0 18px 28px rgba(0,0,0,.55)}
.tile.drop-before{box-shadow:-4px 0 0 0 var(--accent),var(--bev),var(--body)} .tile.drop-after{box-shadow:4px 0 0 0 var(--accent),var(--bev),var(--body)}
.stage-tiles .tile.hit,#hand .tile.hit,#open .tile.hit{box-shadow:var(--bev),var(--body),0 0 0 2px var(--accent),0 0 16px var(--accent)}
.herotiles .tile,.tilesart .tile{box-shadow:var(--bev),var(--body),0 10px 18px rgba(0,0,0,.4)}
.tile.back{--body:0 1.5px 0 var(--tile-back2),0 3px 0 #efe3c6,0 calc(var(--slab) - 1px) 0 #d9c79e,0 var(--slab) 0 #b9a77e,0 calc(var(--slab) + 4px) 8px rgba(0,0,0,.45);
  background:radial-gradient(130% 95% at 28% 12%,#4f86c2 0%,var(--tile-back) 45%,var(--tile-back2) 100%);border-color:#173a5e;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),inset 0 -3px 5px rgba(0,0,0,.25),var(--body)}
.tile.back::before{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.tile.eng-gold{box-shadow:var(--bev),var(--body),0 0 12px rgba(226,192,94,.55)} .tile.eng-obsidian,.tile.eng-jade,.tile.eng-steel{box-shadow:var(--bev),var(--body)}
.tile.eng-glass,.tile.glass{box-shadow:var(--bev),var(--body),inset 0 0 12px rgba(255,255,255,.7)}
.tile.eng-obsidian::before{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0))}

/* Hanabi fireworks over the scoring box */
.fxlayer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.fxlayer i{position:absolute;display:block;will-change:transform,opacity}
.fwrocket{width:3px;height:18px;margin:-18px 0 0 -1.5px;border-radius:2px;background:linear-gradient(180deg,#fff 0%,var(--c) 25%,transparent 100%)}
.fwspark{width:5px;height:5px;border-radius:50%}
.fwflash{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 35%,transparent 70%)}
.wallcell{display:flex;flex-direction:column;align-items:center;padding-top:0} .wallrow{gap:12px 8px}
.wcount{margin-top:7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--fg);line-height:1} .wcount.hasred span:last-child{color:#ff9d93}
.wallcell.out .wcount{color:var(--muted)}
/* The Wall: each face is a little group, its plain copies first and any special copies beside them */
.wallface{display:flex;gap:4px;align-items:flex-start;border-radius:8px} .wallface:has(.special){background:rgba(217,164,65,.08);box-shadow:inset 0 0 0 1px rgba(217,164,65,.22);padding:4px 4px 2px;margin:-4px 0 -2px}
.wallcell.special .wcount{color:var(--accent)}
.wfilter{cursor:pointer;font:inherit;font-size:11px;font-weight:600} .wfilter.on{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.wallgrid.filtering .wallcell:not(.hit){opacity:.22;filter:grayscale(.8)} .wallgrid.filtering .wallcell.hit .tile{box-shadow:0 0 0 2px var(--accent),0 3px 0 #8f815f,0 0 14px rgba(217,164,65,.55)}
.wallgrid .wallcell{transition:opacity .15s}

/* ===== Play field theme A, "Mahjong Parlour": felt table in a wooden rail, brass name plates ===== */
body{background:radial-gradient(120% 80% at 50% 0%,#1c2b25,#0b1210) fixed}
header{background:linear-gradient(180deg,#3a2716,#24170c);border-bottom:2px solid #8a6a3e;box-shadow:0 2px 10px rgba(0,0,0,.5)}
/* the rail sits in the gap around the board (negative margin = padding), so every zone keeps its size */
.board{margin:0;align-self:start;padding:8px;border-radius:16px;background:linear-gradient(180deg,#5a3d22,#3c2814);box-shadow:inset 0 2px 0 rgba(255,220,160,.22),inset 0 -3px 0 rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5)}
.zone{position:relative;background:radial-gradient(140% 120% at 50% 0%,#1f5a45 0%,#174635 55%,#113526 100%);border:1px solid #0c2a1e;box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}
.zone::after{content:'';position:absolute;inset:5px;border:1px dashed rgba(255,230,180,.12);border-radius:7px;pointer-events:none}
.zone .zhead .label{background:linear-gradient(180deg,#e4c27a,#b48a3e);color:#2b1d0b;padding:2px 9px;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.4);font-size:10px}
.zone .zhead .muted{color:#b9cbbf}
.slot{background:rgba(0,0,0,.18);border-color:rgba(255,230,180,.15)}
aside .card{background:linear-gradient(180deg,#2a1d10,#1d140a);border:1px solid #6d5130;box-shadow:inset 0 1px 0 rgba(255,220,160,.15),0 6px 16px rgba(0,0,0,.35)}
/* ===== Action bar: what each button will do, its key, and what is left ===== */
.actions{gap:10px;flex-wrap:wrap;align-items:stretch}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:10px;row-gap:1px;align-items:center;text-align:left;padding:7px 14px 7px 10px;flex:1 1 0;min-width:150px;max-width:240px;border-radius:10px;font-family:var(--body);border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.35),0 6px 12px rgba(0,0,0,.3);transition:transform .08s,filter .12s}
.act:not(:disabled):hover{filter:brightness(1.07);transform:translateY(-1px)} .act:not(:disabled):active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 rgba(0,0,0,.35)}
.act-k{grid-row:1/4;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.act-t{font-size:16px;font-weight:700;line-height:1.15;white-space:nowrap} .act-s{font-size:11px;opacity:.85;font-weight:500;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.act-pips{display:flex;gap:3px;margin-top:2px;min-height:7px} .act-pips i{width:7px;height:7px;border-radius:50%} .act-pips b{font-size:11px}
.act-play{background:linear-gradient(180deg,#f0cf7f,#c79a3e);color:#2b1d0b} .act-play .act-k{background:rgba(43,29,11,.15)} .act-play .act-pips i{background:#2b1d0b}
.act-discard{background:linear-gradient(180deg,#d8574a,#9e2f26);color:#fff3e6} .act-discard .act-k{background:rgba(0,0,0,.2)} .act-discard .act-pips i{background:#fff3e6}
.act-call,.act-kan{background:linear-gradient(180deg,#3b2a18,#291c0f);color:#e8d6b0;border-color:#6d5130;min-width:140px} .act-call .act-k,.act-kan .act-k{background:rgba(255,230,180,.12)}
.act:disabled{opacity:.5;filter:saturate(.6)}

  <p><b>Hand.</b> You hold ${CFG.handSize} tiles drawn from the Wall (136 tiles in the Standard Wall: four of every tile, four of them Red Fives). You refill after every action. A complete hand uses 14 tiles, so you always have spares. If the Wall runs dry you simply stop drawing.</p>
  <p><b>Plays and Discards.</b> You get ${CFG.playsPerBlind} Plays and ${CFG.discardsPerBlind} Discards per Blind, before Talismans, Flowers and Wall effects. A Discard throws up to ${CFG.maxDiscardTiles} tiles into the River, which stays visible for the whole Blind.</p>
  <p><b>Partial plays.</b> Select tiles that split into melds (Chi runs, Pon triplets, Kan quads) plus at most one pair, or two pairs on their own, and press Play. The box in the side panel names the rung it makes: Lone Tile, Pair, Two Pair, one meld, Two Melds, Three Melds, Ready Hand (three melds and a pair) or Four Melds. Bigger rungs score far more, so a hand one tile short is still worth cashing in. Each costs 1 Play. Run Info, Play Ladder tab, lists every rung's Chips and Han.</p>
  <p><b>Complete hand.</b> Select 14 tiles that make four melds and a pair, Seven Pairs, or Thirteen Orphans, and press Play. Its Yaku add Han. A complete hand with no Yaku still gets +1 Han. Each Yakuman counts as 13 Han, and they stack. Run Info lists all Yaku with example hands.</p>
  <p><b>Call.</b> Select one River tile and 2–3 hand tiles that form a meld with it, then press Call. It costs 1 Play and scores nothing yet, and you cannot Call with your last Play. The ${TAL.ryujin.name} Talisman makes your first ${TAL.ryujin.freeCall} Calls each Blind free. The meld is set aside as Open and counts toward your complete hand. Open hands get less Han from some Yaku and lose closed-only Yaku such as Pinfu and Iipeikou. After a Call you discard 1 tile to settle it, which does not use a Discard.</p>
  <p><b>Kan.</b> Four identical tiles can be played as a partial Kan for points, or declared with Declare Kan to set them aside as a closed Kan that counts toward your complete hand without opening it. Every Kan, declared or called, draws one replacement tile. If that tile ends up as the winning tile of your complete hand, you score Rinshan Kaihou (+1 Han).</p>
  <p><b>Furiten.</b> The winning tile of a complete hand is the newest tile you drew among the 14 you play. If a copy of that tile sits in your River, the hand is in Furiten and its Mult is halved. The helper marks waits that are already in your River. With the ${TAL.kawauso.name} Talisman you can claim one River tile as the winning tile: select it together with the rest of the hand and press Play. A claimed hand is always in Furiten, the tile leaves the River, and The Fisherman forbids claiming.</p>
  <p><b>Bosses.</b> Every Ante ends with a Yakuza Boss Blind with a rule twist, shown in red on the blind plate and on the Blind Select screen. Each run meets ${CFG.antes} of the ${Object.keys(BOSSES).length} bosses. Some only turn up from a later Ante, and Ante ${CFG.antes} (and every ${CFG.antes}th Ante in Endless) is always a tougher Showdown Boss. Face-down tiles (The Purist, The House, The Wheel, The Mark) are revealed when played or discarded, and the helper does not count them. Debuffed tiles (The Pillar, The Plant) are crossed out: they still count for melds and Yaku but score nothing. The Peony Flower lets you reroll the Boss for ¥10.</p>
  <h3>Scoring</h3>
  <p><b>Score = Chips × Mult.</b> The play's rung gives base Chips and Han. Every scored tile then adds Chips: 2–8 are worth their face value, and 1s, 9s and Honors are worth 10.</p>
  <p><b>Han becomes Mult.</b> All Han from the rung, Yaku, tiles, Scrolls and Talismans converts once through this table: ${hanTableText()}.</p>
  <p><b>Extra Han.</b> Each Red Five scored gives +1 Han. A Dora indicator is a tile flipped from the Wall; the next tile in sequence after it is the Dora (9 wraps to 1, Winds go East, South, West, North, Dragons go White, Green, Red), and each Dora scored gives +1 Han. Indicators last for the current Blind. In partial plays, a Pon or Kan of Winds or Dragons scores Yakuhai (+1 Han). Each Kan in a play with two or more melds adds +${K.chips} Chips and +${K.han} Han.</p>
  <p><b>Talismans.</b> Han from Talismans and the Holographic edition is counted before the table converts. Everything else fires after it, left to right: some Talismans add Chips, some add flat Mult (+4 Mult), some multiply (×1.5 Mult). A +Mult Talisman placed before a ×Mult Talisman scores more than the reverse. Drag Talismans to reorder them; the number on each card is its firing order. Some Talismans grow as you play and show their current value on the card, and some copy another Talisman. A Talisman you sell and buy again starts fresh.</p>
  <p><b>Scrolls of Mastery.</b> Each level of a meld Scroll gives +${CFG.scrollChips} Chips for every matching meld or pair in a play and +${CFG.scrollHan} Han once per play. Levels apply inside complete hands too, so a complete hand always beats the Ready Hand inside it. Other Scrolls are named after a hand pattern, such as Tanyao, and add Han whenever it scores.</p>
  <p><b>Engravings.</b> Omikuji can engrave tiles, and you can see it on the tile: Gold Foil (gold face, ¥1 when scored), Obsidian (dark stone face, +20 Chips), Jade (green face, ×1.5 Mult), Steel (brushed metal face, ×1.5 Mult while held in hand), Glass (clear blue face, ×2 Mult, 1 in 4 chance to shatter and leave your Wall), and Dragon Mark (a red emblem in the corner, +1 Han). Hover a tile for its exact effect.</p>
  <p><b>Seals.</b> A tile can also carry one Seal beside its engraving, shown as a wax dot on top: ${Object.values(SEALS).map(e => `${e.name} (${e.desc.replace(/\.$/, '').toLowerCase()})`).join('; ')}. Slip of the Red Seal and the Kami Benzaiten, Hachiman and Fūjin add them.</p>
  <p><b>Tile editions.</b> Like Balatro's playing cards, a tile can carry an edition beside its engraving and Seal: ${Object.values(TILE_EDS).map(e => `${e.name} (${e.desc.replace(/\.$/, '').toLowerCase()})`).join(', ')}. Tile +Mult (Holographic, Crimson Inlay, Lucky Inlay) is added after Han becomes Mult, and before the Talismans fire.</p>
  <p><b>Wild and Stone.</b> A Wild Inlay tile becomes whichever suit gives the best play when you play it (up to 4 Wild tiles at once); the helper hints still treat it as its printed suit. A Stone tile has no rank or suit: it never forms a meld or a Kong, rides along with any play for +50 Chips, and is not counted for a complete hand's 14 tiles.</p>
  <p><b>Rarity.</b> Talismans are Common, Uncommon or Rare (about ${Math.round(CFG.rarityWeights.common * 100)}%, ${Math.round(CFG.rarityWeights.uncommon * 100)}% and ${Math.round(CFG.rarityWeights.rare * 100)}% of shop and pack Talismans). Legendary Talismans only come from the rare Kami Hitodama.</p>
  <p><b>Editions.</b> Shop Talismans sometimes come in an edition: ${Object.values(EDITIONS).map(e => `${e.name} (${e.desc})`).join(', ')}.</p>
  <h3>Between Blinds</h3>
  <p><b>Money.</b> Beating a Blind pays ¥${R.small} for a Small Blind, ¥${R.big} for a Big Blind and ¥${R.boss} for a Boss, plus ¥1 for each unused Play and ¥1 interest for every ¥${CFG.interestPer} you hold (at most ¥${CFG.interestCap}). From Red Stake up, Small Blinds pay nothing.</p>
  <p><b>Shop.</b> Spend money on Talismans (passive, ${CFG.talismanSlots} slots), Omikuji and Kami (consumables, ${CFG.consumableSlots} slots, used on selected hand tiles), Scrolls of Mastery (permanent upgrades), Flowers (run-long perks) and Booster Packs (open one and keep one or two of what's inside). Like Balatro, each shop has two card slots (Talismans about 71%, Omikuji and Scrolls about 14% each; Kami come from packs, or the shop with the Ghost Wall), one Flower for the whole Ante, and two Booster Packs; the first shop of a run always has a Talisman pack. Rerolling changes only the cards: it costs ¥5, then ¥1 more each time in the same shop. On wide screens the Shop and packs rise from the bottom of the board, so your Talismans and consumables stay in view above: select one there to sell or use it. Every pack comes in three sizes: Normal, Jumbo (more cards) and Mega (more cards and two picks). Tile Packs add new tiles to your Wall, some engraved, sealed or with an edition. One Flower is offered per Ante and waits in every shop of that Ante until you buy it; upgrades appear once you own the first Flower. Talismans and consumables can also gain sell value (Tsuchinoko, Otoshidama). Omikuji Packs and Kami Packs also deal ${PACK_HAND} random tiles from your Wall: select some and press Use on a card to change them for the rest of the run, or Keep the card for a Blind. After your last pick the changed tiles light up for a moment, then the pack closes back to the shop. ${CONS.indicator.name} and ${CONS.amaterasu.name} only work during a Blind. ${CONS.wealth.name} and ${CONS.raijin.name} can also be used from your slots in the shop; there ${CONS.raijin.name} destroys 2 random tiles from your Wall. Every shop has two random cards (Talismans ${Math.round(CFG.shopWeights.talisman * 100)}%, Omikuji ${Math.round(CFG.shopWeights.omikuji * 100)}%, Kami ${Math.round(CFG.shopWeights.kami * 100)}% each), plus one Scroll, one Flower and one booster pack in fixed spots. A reroll changes only the two random cards and costs ¥${CFG.rerollCost}. Selling returns half the item's value: click a Talisman on the board and press Sell, or sell from inside the shop.</p>
  <p><b>Blind Select.</b> After the shop you see the Ante's three blinds with their targets, rewards and the Boss's rule. A Small or Big Blind can be skipped for the Tag on its card instead of its money: free packs, editions, coupons, money, a bigger hand, a different Boss, free Rare or Uncommon Talismans, Scroll levels, a second Flower (Voucher Tag), and a Double Tag that copies the next Tag you get. Tags you hold show in the side panel.</p>
  <p><b>Setup.</b> A new run lets you choose a Wall (deck), a Stake (difficulty) and a seed. Sharing a seed replays the same Wall, shops and bosses for players with the same unlocks. Each Stake keeps every penalty of the ones below it. Winning on a Stake with a Wall unlocks the next Stake for that Wall. From Black Stake, shop Talismans can carry stickers: Eternal (can't be sold), Perishable (stops working after 5 Blinds, from Orange) and Rental (¥1 to buy, ¥3 every Blind, from Gold).</p>
  <p><b>Special Talismans.</b> Some fade: Kakigōri loses Chips with each play, Senbei loses Mult each Blind, Ramen weakens as you discard, and each leaves when it runs out. Daikoku doubles every listed chance. Yūrei saves a lost Blind once if you scored at least a quarter of the target. Selling Rikishi during a Boss Blind disables the Boss, selling Ramune gives a Double Tag, and selling Kakuremino after 2 Blinds copies another Talisman. With Kabuki, Talismans you already own can turn up again, so you can hold two copies; each copy works on its own.</p>
  <p><b>Walls.</b> Each Wall changes the run: the Plasma Wall averages Chips and Mult before they multiply (targets ×2), the Erratic Wall is 136 random tiles, the Ghost Wall brings Kami to the shop, the Magic Wall starts with Spring and two Slips of Echoes, the Anaglyph Wall gives a Double Tag after every Boss, and the Painted Wall trades a Talisman slot for +2 hand size. Most Walls unlock through goals; the Collection shows them.</p>
  <p><b>Settings.</b> Sound and Music are separate. The animated background, screen shake, CRT filter (Light or Full, with screen curvature and a soft glow), high-contrast tiles and dead-tile dots can each be switched on or off. Reduce motion turns off every animation (it is also on when your device asks for reduced motion). Reset to Defaults puts them all back. Sort by Suit or By Rank from the hand's header.</p>
  <p><b>Challenges.</b> Fixed runs with special rules (${CHALLENGES.length} of them), from the title screen. Winning one is recorded on its own and doesn't count toward Stakes or unlocks. Achievements on the Profile tab track long-term goals.</p>
  <h3>Help and Controls</h3>
  <p><b>Helper.</b> Under your hand the game shows how many tiles you are from a complete hand. Settings can turn that off, and can turn on two more hints: which tiles you are waiting on, and whether the tiles you select can go without setting you back. Against The Purist they only count your visible tiles. Another assist marks dead tiles with green dots.</p>
  <p><b>Arranging.</b> Drag hand tiles to reorder them. Dragging turns off auto-sort; Sort Hand sorts again. Tiles score in the order they sit, which matters for Shikigami. Sorting also works against The Purist, so face-down tiles sit in their sorted place. A selection with face-down tiles always plays: if it isn't a valid play, its best part scores and the other selected tiles go to the River.</p>
  <p><b>Saving.</b> Your run saves automatically after every action. Run Info, Profile tab, keeps lifetime stats across runs. Settings, Your data, exports your profile, settings and current run as a code or file, so you can import them on another device or browser.</p>
  <p><b>Unlocks.</b> Most of the game is open from your first run. ${UNLOCKS.filter(u => u.kind === 'tal').length} Talismans, ${UNLOCKS.filter(u => u.kind === 'wall').length} Walls unlock as you reach goals across runs, such as reaching Ante 6 or winning a run, and each Wall climbs the Stakes on its own. The Collection and Run Info, Profile tab, show each goal and your progress. Locked items never appear in shops or packs. Talismans, consumables, Scrolls, Flowers, packs, Tags and Bosses also stay hidden in the Collection until you first come across them. Settings, Advanced, can unlock and reveal everything for playtesting.</p>
  <p><b>Tile numbers.</b> Characters show their number and Winds their letter in the corner. Dots and Bamboo have none by default, since you count their pips. Settings can show numbers on all tiles or on none.</p>
  <p><b>Keys.</b> Enter or P plays, D discards, C calls, K declares a Kan, Esc clears your selection. Click anywhere or press any key while a play scores to skip the animation. Esc or a click outside closes Rules, Wall, Run Info and Settings.</p>
  </div>`;
}

  <li><b>What scores.</b> Runs (Chi), triplets (Pon), quads (Kan) and pairs. More melds score more, and a complete hand of four melds and a pair (14 tiles) scores the most.</li>
